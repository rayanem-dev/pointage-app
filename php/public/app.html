.vues button.on { background: var(--accent); color: var(--on-accent); font-weight: 600; } .vues button + button { border-inline-start: 1px solid var(--accent); }
.grid.period th.num, .grid.period td.num { min-width: 34px; padding: 0 4px; } .grid.period .first { border-inline-start: 2px solid var(--accent); } .grid.period th.sub { font-size: .7rem; font-weight: 600; }
.grid.period td.num { font-variant-numeric: tabular-nums; }
.bubble { display: inline-block; min-width: 18px; height: 18px; line-height: 18px; padding: 0 5px; margin-inline-start: 6px; border-radius: 9px; background: #e53935; color: #fff; font-size: .7rem; font-weight: 700; text-align: center; vertical-align: middle; }
.toast { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 60; max-width: min(92vw, 520px); padding: 10px 16px; border-radius: 10px; background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 24px rgba(0,0,0,.28); font-weight: 600; cursor: pointer; }
select.langsel { width: auto; padding: 3px 6px; font-size: .8rem; }
[dir=rtl] .table th, [dir=rtl] .table td { text-align: right; } [dir=rtl] .right { text-align: left; } [dir=rtl] label { text-align: right; }
[dir=rtl] .gridwrap:has(.grid) { direction: ltr; } [dir=rtl] .grid td.name, [dir=rtl] .grid .sticky { text-align: left; direction: rtl; }
[dir=rtl] .release ul { padding-left: 0; padding-right: 20px; } [dir=rtl] .release h3 small { margin-left: 0; margin-right: 8px; }

ve","يوم مغادرتك"],["Le jour de votre reprise","On the day you return to work","يوم عودتك إلى العمل"],[", votre solde (T − CR) sera de ",", your balance (T − CR) will be ",", سيكون رصيدك (T − CR) "],[" · reprise prévue le "," · expected return on "," · العودة المتوقعة في "],["Jours fériés : ","Public holidays: ","الأعياد الرسمية: "],["Date estimée (selon la lune, ±1 jour)","Estimated date (depends on the moon, ±1 day)","تاريخ تقديري (حسب رؤية الهلال، ±1 يوم)"],[" prévus · T / CR / ABS / Solde : jours pointés sur la période et cumul depuis le début"," planned · T / CR / ABS / Balance: days recorded over the period and total since the start"," متوقّعة · T / CR / ABS / الرصيد: الأيام المسجَّلة خلال الفترة والمجموع منذ البداية"],["Jours fériés : ajouts et corrections (une ligne par jour : « 2027-03-10 Aïd el-Fitr » ajoute, « - 2027-03-10 » retire). Les fêtes nationales sont fixes ; les fêtes religieuses sont estimées (écart possible d'un jour selon la lune).","Public holidays: additions and corrections (one line per day: \"2027-03-10 Eid el-Fitr\" adds, \"- 2027-03-10\" removes). National holidays are fixed; religious holidays are estimated (may differ by one day depending on the moon).","الأعياد الرسمية: إضافات وتصحيحات (سطر لكل يوم: «2027-03-10 عيد الفطر» للإضافة، «- 2027-03-10» للحذف). الأعياد الوطنية ثابتة، والدينية تقديرية (قد تختلف بيوم حسب الهلال)."],["Nouvel an","New Year's Day","رأس السنة الميلادية"],["Yennayer (Nouvel an amazigh)","Yennayer (Amazigh New Year)","يناير (رأس السنة الأمازيغية)"],["Fête du travail","Labour Day","عيد العمال"],["Fête de l'indépendance","Independence Day","عيد الاستقلال"],["Anniversaire de la Révolution","Revolution Day","ذكرى اندلاع الثورة"],["Nouvel an hégirien","Islamic New Year","رأس السنة الهجرية"],["Achoura","Ashura","عاشوراء"],["Mawlid Ennabaoui","Mawlid (Prophet's birthday)","المولد النبوي الشريف"],["Aïd el-Fitr (jour 1)","Eid el-Fitr (day 1)","عيد الفطر (اليوم 1)"],["Aïd el-Fitr (jour 2)","Eid el-Fitr (day 2)","عيد الفطر (اليوم 2)"],["Aïd el-Adha (jour 1)","Eid el-Adha (day 1)","عيد الأضحى (اليوم 1)"],["Aïd el-Adha (jour 2)","Eid el-Adha (day 2)","عيد الأضحى (اليوم 2)"],["Jour férié","Public holiday","يوم عطلة"],["Début du contrat","Contract start","بداية العقد"],["Durée du contrat (mois)","Contract duration (months)","مدة العقد (أشهر)"],["E-mail du contact client (compte de consultation créé par défaut)","Client contact e-mail (view-only account created by default)","البريد الإلكتروني لجهة اتصال الزبون (حساب اطلاع يُنشأ افتراضيًا)"],["Compte client créé : ","Client account created: ","تم إنشاء حساب الزبون: "],[" — contrat "," — contract "," — العقد "],["Début du contrat : ","Contract start: ","بداية العقد: "],["Durée : ","Duration: ","المدة: "],["Fin : ","End: ","النهاية: "],["Votre remarque (visible par le prestataire)","Your remark (visible to the provider)","ملاحظتك (يراها المؤدّي)"],["Envoyer la remarque","Send the remark","إرسال الملاحظة"],["Remarque envoyée","Remark sent","تم إرسال الملاحظة"],["Remarques du client","Client remarks","ملاحظات الزبون"],["Remarques du client (","Client remarks (","ملاحظات الزبون ("],["Marquer vu","Mark as seen","تعليم كمقروء"],["Répondre","Reply","رد"],["Votre réponse au client :","Your reply to the client:","ردّك على الزبون:"],["Vu","Seen","مقروء"],[" · cliquez sur une case pour laisser une remarque"," · click a cell to leave a remark"," · انقر على خانة لترك ملاحظة"],["Réservé au compte client","Reserved for the client account","مخصّص لحساب الزبون"],["Écrivez votre remarque","Write your remark","اكتب ملاحظتك"],["Remarque introuvable","Remark not found","الملاحظة غير موجودة"],["Date de début du contrat invalide (AAAA-MM-JJ)","Invalid contract start date (YYYY-MM-DD)","تاريخ بداية العقد غير صالح (YYYY-MM-DD)"],["Durée du contrat : nombre de mois entier ≥ 1","Contract duration: whole number of months ≥ 1","مدة العقد: عدد صحيح من الأشهر ≥ 1"],["E-mail du contact client invalide","Invalid client contact e-mail","البريد الإلكتروني لجهة اتصال الزبون غير صالح"],["Compléter les jours non pointés","Fill in the days not yet recorded","استكمال الأيام غير المسجَّلة"],["Pour chaque agent coché, les jours entre son dernier pointage et la date de fin reprennent son dernier statut (T, R ou ABS). Un jour déjà pointé n'est jamais remplacé ; corrigez ensuite à la main les agents dont le statut a changé.","For each ticked agent, the days between the last record and the end date repeat the last status (T, R or ABS). A day already recorded is never replaced; then correct by hand the agents whose status has changed.","لكل عون محدَّد، تأخذ الأيام بين آخر تسجيل وتاريخ النهاية آخر حالة (T أو R أو ABS). لا يُستبدل أي يوم مسجَّل مسبقًا؛ ثم صحّح يدويًا الأعوان الذين تغيّرت حالتهم."],["Jusqu'au (aujourd'hui par défaut)","Until (today by default)","حتى (اليوم افتراضيًا)"],["À partir du (facultatif : sinon le lendemain du dernier pointage de chaque agent)","From (optional: otherwise the day after each agent's last record)","ابتداءً من (اختياري: وإلا اليوم الموالي لآخر تسجيل لكل عون)"],[" Suivre la rotation prévue au lieu de répéter le dernier statut"," Follow the planned rotation instead of repeating the last status"," اتباع التناوب المتوقّع بدل تكرار آخر حالة"],[" Tous les agents"," All agents"," جميع الأعوان"],["Copier le dernier pointage","Copy the last record","نسخ آخر تسجيل"],["Période trop longue (93 jours maximum par agent) : ","Period too long (93 days maximum per agent): ","فترة طويلة جدًا (93 يومًا كحد أقصى لكل عون): "],["Un seul bouton pour rattraper les jours oubliés : du lendemain du dernier pointage jusqu'à aujourd'hui, chaque agent garde son dernier statut (T, R ou ABS).","One button to catch up on forgotten days: from the day after the last record until today, each agent keeps their last status (T, R or ABS).","زر واحد لتدارك الأيام المنسية: من اليوم الموالي لآخر تسجيل حتى اليوم، يحتفظ كل عون بآخر حالة له (T أو R أو ABS)."],["Vous choisissez les agents (ou tous) et la date de fin. Vous pouvez aussi suivre la rotation prévue.","You choose the agents (or all) and the end date. You can also follow the planned rotation.","تختار الأعوان (أو الكل) وتاريخ النهاية. ويمكنك أيضًا اتباع التناوب المتوقّع."],["Les jours déjà pointés ne sont jamais modifiés. Un résumé vous est montré avant de valider.","Days already recorded are never changed. A summary is shown before you confirm.","لا تتغير الأيام المسجَّلة مسبقًا أبدًا. يُعرض ملخص قبل التأكيد."],["Compte client, remarques et durée du contrat","Client account, remarks and contract duration","حساب الزبون والملاحظات ومدة العقد"],["Le contrat indique maintenant sa date de début, sa durée et sa date de fin. Tout le monde peut les voir.","The contract now shows its start date, duration and end date. Everyone can see them.","يعرض العقد الآن تاريخ بدايته ومدته وتاريخ نهايته. يمكن للجميع الاطلاع عليها."],["En ajoutant l'e-mail du contact client dans le contrat, son compte de consultation est créé et ses accès peuvent lui être envoyés.","By adding the client contact's e-mail in the contract, their view-only account is created and their access can be sent to them.","بإضافة البريد الإلكتروني لجهة اتصال الزبون في العقد، يُنشأ حسابه للاطلاع ويمكن إرسال بيانات الدخول إليه."],["Le client peut laisser une remarque sur n'importe quel jour du pointage. Le responsable d’équipe est prévenu, répond, et le client voit la réponse.","The client can leave a remark on any day of the attendance. The team manager is notified, replies, and the client sees the reply.","يمكن للزبون ترك ملاحظة على أي يوم من الحضور. يُبلَّغ رئيس الفريق ويرد، ويرى الزبون الرد."],["Vues 3 mois, 6 mois, 1 an et jours fériés","3-month, 6-month and 1-year views and public holidays","عروض 3 أشهر و6 أشهر وسنة والأعياد الرسمية"],["Le pointage global peut s'afficher sur 3 mois, 6 mois ou 1 an, avec les mêmes couleurs que le mois. Le jour d'aujourd'hui est repéré.","The global attendance can be shown over 3 months, 6 months or 1 year, with the same colours as the month. Today is highlighted.","يمكن عرض الحضور العام على 3 أشهر أو 6 أشهر أو سنة بنفس ألوان الشهر. ويتم تمييز اليوم الحالي."],["Les jours fériés algériens sont visibles dans toutes les vues : fêtes nationales et fêtes religieuses. Les dates religieuses sont estimées (un jour d'écart est possible) et se corrigent dans Setup → Rotation.","Algerian public holidays are visible in all views: national and religious holidays. Religious dates are estimated (a one-day difference is possible) and can be corrected in Setup → Rotation.","الأعياد الرسمية الجزائرية ظاهرة في جميع العروض: الوطنية والدينية. التواريخ الدينية تقديرية (قد يكون هناك فرق يوم واحد) ويمكن تصحيحها في الإعداد ← التناوب."],["Pages plus rapides","Faster pages","صفحات أسرع"],["L'application s'ouvre et change de page plus vite.","The application opens and changes page faster.","يُفتح التطبيق وتتغير الصفحات بسرعة أكبر."],["Solde au départ et pointage de l'agent","Balance at departure and agent attendance","الرصيد عند المغادرة وحضور العون"],["Sur l'accueil de l'agent : le solde (T − CR) que l'agent aura le jour de son départ en congé, ou de sa reprise.","On the agent's home page: the balance (T − CR) the agent will have on the day they leave on leave, or return.","في الصفحة الرئيسية للعون: الرصيد (T − CR) الذي سيكون لديه يوم مغادرته في إجازة أو عودته."],["Nouvel onglet « Mon pointage » : l'agent consulte son propre pointage sur 1 mois, 3 mois, 6 mois ou 1 an.","New tab \"My attendance\": the agent views their own attendance over 1 month, 3 months, 6 months or 1 year.","تبويب جديد «حضوري»: يطلع العون على حضوره على شهر أو 3 أشهر أو 6 أشهر أو سنة."],["Les demandes de congé affichent les dates demandées et la date de reprise prévue.","Leave requests show the requested dates and the expected return date.","تعرض طلبات الإجازة التواريخ المطلوبة وتاريخ العودة المتوقّع."],["Pastilles et notifications","Bubbles and notifications","الإشارات والتنبيهات"],["Une pastille sur « Mes documents » indique les nouveaux documents. Un message s'affiche quand un document arrive, et l'agent reçoit aussi un e-mail.","A bubble on \"My documents\" shows new documents. A message appears when a document arrives, and the agent also receives an e-mail.","تظهر إشارة على «وثائقي» للوثائق الجديدة. تظهر رسالة عند وصول وثيقة، ويتلقى العون أيضًا بريدًا إلكترونيًا."],["Le responsable d’équipe voit une pastille sur « Demandes » et reçoit un e-mail à chaque nouvelle demande.","The team manager sees a bubble on \"Requests\" and receives an e-mail for each new request.","يرى رئيس الفريق إشارة على «الطلبات» ويتلقى بريدًا إلكترونيًا مع كل طلب جديد."],["Trois langues et mode sombre","Three languages and dark mode","ثلاث لغات والوضع الداكن"],["L'application existe en français, en arabe et en anglais. Le choix se fait en bas à droite.","The application is available in French, Arabic and English. The choice is at the bottom right.","التطبيق متوفر بالفرنسية والعربية والإنجليزية. يتم الاختيار أسفل اليمين."],["Un mode sombre est disponible, avec une petite bascule soleil / lune en bas à droite.","A dark mode is available, with a small sun / moon switch at the bottom right.","يتوفر وضع داكن مع مفتاح صغير شمس / قمر أسفل اليمين."],["Accès des agents par e-mail","Agent access by e-mail","إرسال بيانات دخول الأعوان بالبريد الإلكتروني"],["À la création d'un agent, ses accès (lien, identifiant, mot de passe provisoire) peuvent lui être envoyés par e-mail.","When an agent is created, their access (link, login, temporary password) can be sent to them by e-mail.","عند إنشاء عون، يمكن إرسال بيانات دخوله (الرابط، المعرّف، كلمة المرور المؤقتة) إليه بالبريد الإلكتروني."],["Un bouton « Envoyer l'accès » dans la liste des agents permet de les renvoyer à tout moment.","A \"Send access\" button in the agent list lets you send it again at any time.","يتيح زر «إرسال بيانات الدخول» في قائمة الأعوان إعادة إرسالها في أي وقت."],["Sijil : nouveau nom et nouveau logo","Sijil: new name and new logo","Sijil: اسم جديد وشعار جديد"],["L'application s'appelle Sijil, avec un nouveau logo et de nouvelles couleurs.","The application is now called Sijil, with a new logo and new colours.","يسمى التطبيق الآن Sijil، بشعار جديد وألوان جديدة."],["Export du pointage en Excel","Attendance export to Excel","تصدير الحضور إلى Excel"],["Setup → Maintenance : exporter un pointage en Excel, avec le contrat, les prix, les agents et les attachements qui en dépendent.","Setup → Maintenance: export an attendance record to Excel, with the contract, prices, agents and statements that depend on it.","الإعداد ← الصيانة: تصدير سجل حضور إلى Excel مع العقد والأسعار والأعوان وكشوف الإنجاز المرتبطة به."],["Le même fichier peut être réimporté en entier.","The same file can be fully re-imported.","يمكن إعادة استيراد الملف نفسه بالكامل."],["Import d'un pointage Excel","Attendance import from Excel","استيراد الحضور من Excel"],["Setup → Maintenance : importer un pointage depuis un fichier Excel, un mois par onglet.","Setup → Maintenance: import an attendance record from an Excel file, one month per tab.","الإعداد ← الصيانة: استيراد سجل حضور من ملف Excel، شهر لكل تبويب."],["Les noms écrits différemment sont rapprochés des agents existants, et les agents inconnus peuvent être créés.","Names written differently are matched with existing agents, and unknown agents can be created.","تتم مطابقة الأسماء المكتوبة بشكل مختلف مع الأعوان الموجودين، ويمكن إنشاء الأعوان غير المعروفين."],["Dans la modification groupée des agents, vous pouvez aussi changer la fonction.","In the agents' bulk edit, you can also change the function.","في التعديل الجماعي للأعوان، يمكنك أيضًا تغيير الوظيفة."],["Compte client (consultation)","Client account (view only)","حساب الزبون (للاطلاع فقط)"],["Nouveau rôle « Client » : il suit le pointage, le contrat, les attachements et les factures validés, sans rien modifier.","New role \"Client\": they follow the validated attendance, contract, statements and invoices, without changing anything.","دور جديد «الزبون»: يتابع الحضور والعقد وكشوف الإنجاز والفواتير المعتمدة دون تعديل أي شيء."],["Historique des attachements et factures","History of statements and invoices","سجل كشوف الإنجاز والفواتير"],["La liste des attachements et des factures validés, avec leurs PDF à télécharger.","The list of validated statements and invoices, with their PDFs to download.","قائمة كشوف الإنجاز والفواتير المعتمدة مع ملفات PDF للتنزيل."],["Un tableau par fonction montre ce qui a déjà été facturé et ce qui reste à facturer.","A table per function shows what has already been invoiced and what remains to be invoiced.","يعرض جدول لكل وظيفة ما تمت فوترته وما بقي للفوترة."],["Rotations et modification groupée","Rotations and bulk edit","التناوب والتعديل الجماعي"],["Plusieurs types de rotation au choix (28/28, 14/14, 21/21…), et une rotation propre à chaque agent.","Several rotation types to choose from (28/28, 14/14, 21/21…), and a rotation specific to each agent.","عدة أنواع تناوب للاختيار (28/28، 14/14، 21/21…) وتناوب خاص بكل عون."],["Dans la liste des agents, cochez plusieurs lignes pour les modifier en une seule fois.","In the agent list, tick several lines to edit them all at once.","في قائمة الأعوان، حدّد عدة أسطر لتعديلها دفعة واحدة."],["La quantité de l'attachement reprend les jours de travail réellement pointés.","The statement quantity uses the work days actually recorded.","تعتمد كمية كشف الإنجاز على أيام العمل المسجَّلة فعليًا."],["Setup en onglets","Setup in tabs","الإعداد في تبويبات"],["Le Setup est rangé en onglets : Contrat, Prestataire, Client, Rotation et Maintenance.","Setup is organised in tabs: Contract, Provider, Client, Rotation and Maintenance.","الإعداد منظّم في تبويبات: العقد، المؤدّي، الزبون، التناوب والصيانة."],["Sauvegarde et restauration de vos données depuis l'onglet Maintenance.","Backup and restore of your data from the Maintenance tab.","نسخ احتياطي واستعادة بياناتك من تبويب الصيانة."],["Fiche de pointage, attachement et documents","Attendance sheet, statement and documents","ورقة الحضور وكشف الإنجاز والوثائق"],["La fiche de pointage et l'attachement s'exportent en Excel et en PDF.","The attendance sheet and the statement can be exported to Excel and PDF.","يمكن تصدير ورقة الحضور وكشف الإنجاز إلى Excel وPDF."],["Les documents des agents sont reconnus, renommés et rangés automatiquement.","Agents' documents are recognised, renamed and filed automatically.","يتم التعرّف على وثائق الأعوان وإعادة تسميتها وحفظها تلقائيًا."],["Prévisions","Forecasts","التوقعات"],["Dès le premier pointage, l'application prévoit les jours de travail et de repos suivants. Un pointage réel n'est jamais remplacé.","From the first record, the application forecasts the following work and rest days. A real record is never replaced.","منذ أول تسجيل يتوقّع التطبيق أيام العمل والراحة التالية. لا يُستبدل أي تسجيل فعلي أبدًا."],["Contrats","Contracts","العقود"],["Le contrat est résumé en une page. Le bordereau des prix se dépose en un geste.","The contract is summarised on one page. The price schedule is dropped in one gesture.","يُلخَّص العقد في صفحة واحدة. ويُرفع جدول الأسعار بحركة واحدة."],["L'attachement validé est figé, puis la facture est établie.","The validated statement is locked, then the invoice is issued.","يُثبَّت كشف الإنجاز المعتمد ثم تصدر الفاتورة."],["Bordereau des prix, effectifs et véhicules","Price schedule, staffing and vehicles","جدول الأسعار والأعوان والمركبات"],["Lecture du bordereau des prix (PDF scanné, photo, Excel ou CSV).","Reading of the price schedule (scanned PDF, photo, Excel or CSV).","قراءة جدول الأسعار (PDF ممسوح أو صورة أو Excel أو CSV)."],["Les effectifs suivent le contrat, et les véhicules mis à disposition sont gérés comme les agents.","Staffing follows the contract, and vehicles provided are managed like agents.","يتبع عدد الأعوان العقد، وتُسيَّر المركبات الموضوعة تحت التصرف مثل الأعوان."],["Première version","First version","النسخة الأولى"],["Espaces agent, responsable d’équipe et administrateur. Pointage T / R / ABS. Demandes des agents regroupées par thème et envoyées à la direction.","Agent, team manager and administrator spaces. T / R / ABS attendance. Agents' requests grouped by theme and sent to management.","فضاءات العون ورئيس الفريق والمسؤول. تسجيل الحضور T / R / ABS. طلبات الأعوان مجمَّعة حسب الموضوع ومرسَلة إلى الإدارة."],["Compléter du","Fill in from","استكمال من"],["au","to","إلى"],["rotation","rotation","التناوب"],["À partir du (vide : le lendemain du dernier pointage de chaque agent)","From (empty: the day after each agent's last record)","ابتداءً من (فارغ: اليوم الموالي لآخر تسجيل لكل عون)"],["Suivre la rotation prévue au lieu de répéter le dernier statut","Follow the planned rotation instead of repeating the last status","اتباع التناوب المتوقّع بدل تكرار آخر حالة"],["Recopie le dernier statut (T, R ou ABS) des agents cochés jusqu'à la date de fin ; un jour déjà pointé n'est jamais remplacé","Copies the last status (T, R or ABS) of the ticked agents up to the end date; a day already recorded is never replaced","ينسخ آخر حالة (T أو R أو ABS) للأعوان المحدَّدين حتى تاريخ النهاية؛ لا يُستبدل أي يوم مسجَّل مسبقًا"],["Tous les agents","All agents","جميع الأعوان"],["Rien à copier : les agents cochés sont à jour jusqu'au ","Nothing to copy: the ticked agents are up to date until ","لا شيء للنسخ: الأعوان المحدَّدون محدَّثون حتى "],[" jour(s) à pointer pour "," day(s) to record for "," يوم (أيام) للتسجيل لـ "],[" agent(s), jusqu'au "," agent(s), until "," عون (أعوان)، حتى "],["Confirmer ?","Confirm?","تأكيد؟"],[" jour(s) pointés pour "," day(s) recorded for "," يوم (أيام) مسجَّلة لـ "],["Aide","Help","مساعدة"],["Rechercher dans l'aide","Search the help","البحث في المساعدة"],["Pour les autres rôles","For other roles","للأدوار الأخرى"],["Aucun résultat.","No result.","لا توجد نتيجة."],["Les sections de votre rôle sont ouvertes ; les autres sont en dessous. Le manuel complet avec captures d'écran est disponible auprès de votre administrateur.","The sections for your role are open; the others are below. The full manual with screenshots is available from your e connexion de chacun, le nombre de connexions, et ceux qui ne se sont jamais connectés.","New \"Connections\" tab for the administrator: who is online now, each person's last connection date, the number of connections, and who has never connected.","علامة جديدة «الاتصالات» للمسؤول: من متصل الآن، وتاريخ آخر اتصال لكل شخص، وعدد الاتصالات، ومن لم يتصل أبدًا."],["Privilèges du responsable d’équipe et plusieurs e-mails","Team manager privileges and several e-mails","صلاحيات مسؤول الفريق وعدة عناوين بريد"],["L'administrateur choisit, chef par chef, s'il peut extraire l'attachement et la facture (case dans sa fiche), en plus de l'accès au Setup.","The administrator chooses, manager by manager, whether they can extract the statement and invoice (tick box in their record), in addition to Setup access.","يختار المسؤول، لكل مسؤول فريق، هل يمكنه استخراج المحضر والفاتورة (خانة في بطاقته)، إضافةً إلى الوصول إلى الإعدادات."],["L'onglet Client accepte jusqu'à 4 e-mails de contact client (Setup → Client) : chacun reçoit son compte de consultation, avec les mêmes droits.","The Client tab accepts up to 4 client contact e-mails (Setup → Client): each gets a view-only account with the same rights.","تقبل علامة العميل حتى 4 عناوين بريد (الإعدادات ← العميل): يحصل كل عنوان على حساب اطلاع بنفس الحقوق."],["L'e-mail de la direction du prestataire accepte aussi 4 adresses.","The provider management e-mail also accepts 4 addresses.","يقبل بريد إدارة المزوّد أيضًا 4 عناوين."],["Exports pour le responsable d’équipe","Exports for the team manager","التصدير لمسؤول الفريق"],["Le responsable d’équipe a un nouvel onglet « Exports » : il extrait en Excel ou PDF la fiche de pointage, l'attachement et la facture déjà établie. Il consulte seulement ; la validation reste à l'administrateur.","The team manager has a new \"Exports\" tab: extract the attendance sheet, the statement and the issued invoice as Excel or PDF. Read-only; validation stays with the administrator.","لمسؤول الفريق علامة جديدة «التصدير -07, NAME_Firstname_MAJCNAS_Janvier2026_Mars2026, NAME_Firstname_AttestationTravail_2026-05-04, NAME_Firstname_AttestationEmoluments_Janvier2026_Mars2026. You check, then send: nothing reaches the agent before your approval.","أودِع عدة مستندات دفعة واحدة (كشوف الرواتب، شهادات العطلة، العقود، شهادات CNAS…). يتعرّف Sijil على العون والنوع والتواريخ ثم يقترح الاسم: TC_NOM_Prenom_2026-02-14 وNOM_Prenom_FDP_Mars2026 وNOM_Prenom_2026-04-04_Contrat وNOM_Prenom_AttestationCNAS_n°_2026-05-07 وNOM_Prenom_MAJCNAS_Janvier2026_Mars2026 وNOM_Prenom_AttestationTravail_2026-05-04 وNOM_Prenom_AttestationEmoluments_Janvier2026_Mars2026. تتحقق ثم ترسل: لا يصل شيء إلى العون قبل موافقتك."],["Fichiers (10 Mo maximum chacun)","Files (10 MB maximum each)","الملفات (10 ميغابايت كحد أقصى لكل ملف)"],["Agent pour tous les fichiers (facultatif)","Agent for all files (optional)","العون لكل الملفات (اختياري)"],["Convertir les images (photos, scans JPG ou PNG) en PDF"," Convert images (photos, JPG or PNG scans) to PDF","تحويل الصور (JPG أو PNG) إلى PDF"],["Analyser les documents","Analyse the documents","تحليل المستندات"],["Choisissez un ou plusieurs fichiers.","Choose one or more files.","اختر ملفًا واحدًا أو أكثر."],["Envoyer ","Send ","إرسال "],["document(s) dans l’espace des agents ?\n\n","document(s) to the agents' spaces?\n\n","مستند(ات) إلى مساحات الأعوان؟\n\n"],["\n\nChaque agent sera prévenu par e-mail.","\n\nEach agent will be notified by e-mail.","\n\nسيُبلَّغ كل عون بالبريد الإلكتروني."],["Dépôt de documents en vrac","Bulk document upload","إيداع المستندات دفعة واحدة"],["Déposez plusieurs documents d'un coup : Sijil reconnaît l'agent, le type et les dates, et propose le nom (TC_NOM_Prenom_2026-02-14, NOM_Prenom_FDP_Mars2026, contrat, attestations CNAS, attestation de travail, attestation d'émoluments…).","Upload several documents at once: Sijil recognises the agent, type and dates, and proposes the name (TC_NAME_Firstname_2026-02-14, NAME_Firstname_FDP_Mars2026, contract, CNAS certificates, employment certificate, earnings certificate…).","أودِع عدة مستندات دفعة واحدة: يتعرّف Sijil على العون والنوع والتواريخ ويقترح الاسم (TC_NOM_Prenom_2026-02-14، NOM_Prenom_FDP_Mars2026، العقد، شهادات CNAS، شهادة العمل، شهادة الأجر…)."],["Vous vérifiez et corrigez la liste, puis vous l'envoyez : rien n'arrive chez les agents avant votre accord, et chacun reçoit un seul e-mail.","You check and correct the list, then send it: nothing reaches the agents before your approval, and each gets a single e-mail.","تراجع القائمة وتصحّحها ثم ترسلها: لا يصل شيء إلى الأعوان قبل موافقتك، ويتلقى كل منهم بريدًا واحدًا."],["Les photos et scans peuvent être convertis en PDF.","Photos and scans can be converted to PDF.","يمكن تحويل الصور والمسح الضوئي إلى PDF."],["Nouveaux documents que l'agent peut demander : copie du contrat, attestation CNAS, mise à jour CNAS, attestation d'émoluments.","New documents an agent can request: copy of the contract, CNAS certificate, CNAS update, earnings certificate.","مستندات جديدة يمكن للعون طلبها: نسخة من العقد، شهادة CNAS، تحديث CNAS، شهادة الأجر."],["Conversion en PDF corrigée","PDF conversion fixed","تصحيح التحويل إلى PDF"],["La conversion des photos et scans (JPEG, PNG) en PDF fonctionne : une page par image, et les photos prises au téléphone gardent le bon sens. Si un format d'image ne peut pas être converti, le fichier est gardé tel quel et la liste vous le signale.","Converting photos and scans (JPEG, PNG) to PDF now works: one page per image, and phone photos keep the right orientation. If an image format cannot be converted, the file is kept as is and the list tells you.","يعمل الآن تحويل الصور والمسح الضوئي (JPEG وPNG) إلى PDF: صفحة لكل صورة، وتحتفظ صور الهاتف باتجاهها الصحيح. إذا تعذّر تحويل صيغة صورة يُحفظ الملف كما هو وتُنبّهك القائمة."],["Aperçu","Preview","معاينة"],["Voir le document pour vérifier","View the document to check it","عرض المستند للتحقق"],["Ouvrir dans un onglet","Open in a tab","فتح في علامة تبويب"],["Fermer","Close","إغلاق"],["Aperçu indisponible pour ce format : ouvrez ou téléchargez le fichier.","Preview unavailable for this format: open or download the file.","المعاينة غير متاحة لهذه الصيغة: افتح الملف أو نزّله."],["Aperçu des documents","Document preview","معاينة المستندات"],["Un bouton « Aperçu » permet de voir un document avant de l'envoyer à l'agent, et aussi dans la liste des documents déjà rangés. Il montre les PDF et les images, avec un accès pour l'ouvrir dans un onglet ou le télécharger.","A \"Preview\" button lets you see a document before sending it to the agent, and also in the list of filed documents. It shows PDFs and images, with a way to open it in a tab or download it.","يتيح زر «معاينة» رؤية المستند قبل إرساله إلى العون، وأيضًا في قائمة المستندات المحفوظة. يعرض ملفات PDF والصور مع إمكانية فتحه في علامة تبويب أو تنزيله."],["Se connecter comme cet utilisateur","Sign in as this user","الدخول كهذا المستخدم"],["Utilisateur","User","المستخدم"],[" » en tant que "," » as "," » بصفة "],["Utilisateur introuvable","User not found","المستخدم غير موجود"],["Version","Version","الإصدار"],["Site : ","Site: ","الموقع: "],["Serveur : v","Server: v","الخادم: v"],["Vérification…","Checking…","جارٍ التحقق…"],["✓ Tout est à jour","✓ Everything is up to date","✓ كل شيء محدّث"],["⚠ Le serveur est en retard : v","⚠ The server is behind: v","⚠ الخادم متأخر: v"],[" au lieu de v"," instead of v"," بدل v"],[". À déployer.",". To deploy.",". يجب النشر."],["⚠ Le site est en retard : v","⚠ The site is behind: v","⚠ الموقع متأخر: v"],[". À publier (patientez 1 à 2 minutes).",". To publish (wait 1 to 2 minutes).",". يجب النشر (انتظر دقيقة إلى دقيقتين)."],["Impossible de lire la version du site.","Unable to read the site version.","تعذّرت قراءة إصدار الموقع."],["indisponible","unavailable","غير متاح"],["Connexion par utilisateur et carte Version","Sign-in by user and Version card","الدخول حسب المستخدم وبطاقة الإصدار"],["L'éditeur choisit une entreprise puis un utilisateur de cette entreprise pour se connecter à sa place et intervenir directement. Chaque accès est noté dans le journal.","The publisher picks a company, then one of its users, to sign in as them and act directly. Every access is recorded in the log.","يختار الناشر شركة ثم أحد مستخدميها للدخول مكانه والتدخل مباشرة. يُسجَّل كل دخول في السجل."],["Une carte « Version » compare le site et le serveur : « Tout est à jour » ou ce qu'il reste à publier.","A \"Version\" card compares the site and the server: \"Everything is up to date\" or what is left to publish.","تقارن بطاقة «الإصدار» الموقع والخادم: «كل شيء محدّث» أو ما بقي للنشر."],["Les documents peuvent peser jusqu'à 10 Mo.","Documents can weigh up to 10 MB.","يمكن أن يصل حجم المستندات إلى 10 ميغابايت."],["Conversion PDF des grosses photos et menu Version","PDF conversion of large photos and Version menu","تحويل الصور الكبيرة إلى PDF وقائمة الإصدار"],["La conversion en PDF fonctionne aussi pour les photos de plusieurs Mo (elle échouait sur les vraies photos de téléphone). Si une image ne peut pas être convertie, la raison est indiquée.","PDF conversion also works for photos of several MB (it failed on real phone photos). If an image cannot be converted, the reason is shown.","يعمل التحويل إلى PDF الآن أيضًا للصور ذات الحجم الكبير (كان يفشل مع صور الهاتف الحقيقية). إذا تعذّر تحويل صورة يُذكر السبب."],["« Version » est maintenant dans le menu de l'éditeur, avec ✓ quand le site et le serveur sont à jour.","\"Version\" is now in the publisher's menu, with ✓ when the site and the server are up to date.","أصبحت «الإصدار» في قائمة الناشر مع ✓ عندما يكون الموقع والخادم محدّثين."],[" Conversion PDF impossible ("," PDF conversion impossible ("," تعذّر التحويل إلى PDF ("],["⚠ Conversion PDF impossible (","⚠ PDF conversion impossible (","⚠ تعذّر التحويل إلى PDF ("],["converti en PDF","converted to PDF","تم التحويل إلى PDF"],["⛔ Doublon : ","⛔ Duplicate: ","⛔ مكرّر: "],["⚠ Attention : ","⚠ Warning: ","⚠ تنبيه: "],["Doublon","Duplicate","مكرّر"],["Doublon exact : confirmez l'envoi","Exact duplicate: confirm sending","مكرّر تمامًا: أكّد الإرسال"],["\n\n⛔ "," \n\n⛔ ","\n\n⛔ "],[" doublon(s) exact(s) : le même fichier est déjà classé ou listé. Les envoyer quand même ?"," exact duplicate(s): the same file is already filed or listed. Send them anyway?"," مكرّر(ات) تمامًا: الملف نفسه مصنّف أو مدرج بالفعل. إرسالها رغم ذلك؟"],["\n\n⚠ ","\n\n⚠ ","\n\n⚠ "],[" document(s) du même type et de la même période qu’un document déjà classé."," document(s) of the same type and period as an already filed document."," مستند(ات) من النوع والفترة نفسيهما لمستند مصنّف بالفعل."],["Détection des doublons","Duplicate detection","اكتشاف التكرار"],["Un même fichier déposé deux fois est signalé : « Doublon » (déjà classé chez l'agent, ou déjà dans la liste). Son envoi demande une confirmation.","The same file uploaded twice is flagged: \"Duplicate\" (already filed for the agent, or already in the list). Sending it requires confirmation.","يُنبَّه إلى الملف نفسه المودَع مرتين: «مكرّر» (مصنّف بالفعل لدى العون أو مدرج في القائمة). ويتطلب إرساله تأكيدًا."],["Un document du même type et de la même période qu'un document déjà classé (par exemple une 2e fiche de paie de mars) est signalé par un avertissement.","A document of the same type and period as an already filed document (e.g. a second March payslip) is flagged with a warning.","يُنبَّه بتحذير إلى مستند من النوع والفترة نفسيهما لمستند مصنّف بالفعل (مثل كشف راتب ثانٍ لشهر مارس)."],[" ⚠ E-mail non envoyé à "," ⚠ E-mail not sent to "," ⚠ لم يُرسَل البريد إلى "],[" : le document est bien dans son espace."," : the document is in their space."," : المستند موجود في مساحته."],["Notifications de documents fiabilisées","More reliable document notifications","إشعارات المستندات أكثر موثوقية"],["Le « Nouveau » des documents est conservé par Sijil jusqu'à ce que l'agent ouvre sa liste : il s'affiche même si l'agent se connecte plus tard, sur n'importe quel appareil.","The \"New\" marker on documents is kept by Sijil until the agent opens the list: it shows even if the agent signs in later, on any device.","يحتفظ Sijil بعلامة «جديد» على المستندات إلى أن يفتح العون القائمة: تظهر حتى لو دخل العون لاحقًا، على أي جهاز."],["Quand l'éditeur ouvre la session d'un agent pour l'aider, les documents ne sont pas marqués comme lus à sa place.","When the publisher opens an agent's session to help, documents are not marked as read in their place.","عندما يفتح الناشر جلسة عون لمساعدته لا تُعلَّم المستندات كمقروءة مكانه."],["Si l'e-mail de notification ne peut pas partir (adresse absente ou invalide, limite d'envoi de Google), la raison est indiquée au moment de l'envoi ; le document est bien dans l'espace de l'agent.","If the notification e-mail cannot be sent (missing or invalid address, Google sending limit), the reason is shown at sending time; the document is in the agent's space.","إذا تعذّر إرسال بريد الإشعار (عنوان مفقود أو غير صالح، حد الإرسال لدى Google) يُذكر السبب عند الإرسال؛ والمستند موجود في مساحة العون."],["Remarques des agents sur leur pointage","Agent remarks on their attendance","ملاحظات الأعوان على حضورهم"],["Documents jusqu'à 10 Mo","Documents up to 10 MB","مستندات حتى 10 ميغابايت"],["Conversion PDF des grosses photos","PDF conversion of large photos","تحويل الصور الكبيرة إلى PDF"],["Nouveautés réservées à l'éditeur","Publisher-only news","مستجدات خاصة بالناشر"],["Les nouveautés côté éditeur (console, support, suivi des versions) sont masquées aux utilisateurs des entreprises.","Publisher-side news (console, support, version tracking) is hidden from company users.","المستجدات الخاصة بالناشر (اللوحة، الدعم، تتبع الإصدارات) مخفية عن مستخدمي الشركات."],["Déposez plusieurs documents à la fois (fiches de paie, titres de congé, contrats, attestations CNAS…). Sijil reconnaît l’agent, le type et les dates, puis propose le nom. Vous vérifiez, puis vous envoyez : rien n’arrive chez l’agent avant votre accord.","Upload several documents at once (payslips, leave certificates, contracts, CNAS certificates…). Sijil recognises the agent, type and dates, then proposes the name. You check, then send: nothing reaches the agent before your approval.","أودِع عدة مستندات دفعة واحدة (كشوف الرواتب، شهادات العطلة، العقود، شهادات CNAS…). يتعرّف Sijil على العون والنوع والتواريخ ثم يقترح الاسم. تتحقق ثم ترسل: لا يصل شيء إلى العون قبل موافقتك."],[" (sera converti en PDF à l'envoi)"," (will be converted to PDF when sent)"," (سيُحوَّل إلى PDF عند الإرسال)"],["Dates lues dans le contenu du document : à vérifier.","Dates read from the document content: please check.","تواريخ مقروءة من محتوى المستند: يرجى التحقق."],[" ⚠ Conversion PDF impossible (format d'image non géré : PNG avec transparence, GIF, BMP ou JPEG CMJN) : fichier conservé tel quel."," ⚠ PDF conversion impossible (unsupported image format: PNG with transparency, GIF, BMP or CMYK JPEG): file kept as is."," ⚠ تعذّر التحويل إلى PDF (صيغة صورة غير مدعومة: PNG بشفافية أو GIF أو BMP أو JPEG CMYK): يُحفظ الملف كما هو."],["Zone vide ? Cliquez sur « Ouvrir dans un onglet ».","Blank area? Click \"Open in a tab\".","المنطقة فارغة؟ انقر «فتح في علامة تبويب»."],["Dépôt de documents : mois abrégés, aperçu des photos","Document upload: abbreviated months, photo preview","إيداع المستندات: أشهر مختصرة ومعاينة الصور"],["Le mois est reconnu même abrégé dans le nom du fichier : « FEVR 26 », « JANV 26 », « dec 25 » (février 2026, janvier 2026, décembre 2025). Le mois du nom du fichier prime sur celui lu dans le document, et un avertissement signale les dates lues dans le contenu.","The month is recognised even when abbreviated in the file name: \"FEVR 26\", \"JANV 26\", \"dec 25\" (February 2026, January 2026, December 2025). The month in the file name takes precedence over the one read in the document, and a warning flags dates read from the content.","يُتعرَّف على الشهر حتى لو كان مختصرًا في اسم الملف: «FEVR 26» و«JANV 26» و«dec 25» (فبراير 2026 وجانفي 2026 وديسمبر 2025). يتقدّم شهر اسم الملف على المقروء في المستند، ويُنبّه تحذير إلى التواريخ المقروءة من المحتوى."],["Les photos et scans JPG ou PNG sont convertis en PDF au moment de l'envoi : l'aperçu montre l'image d'origine, qui s'affiche toujours.","JPG or PNG photos and scans are converted to PDF at sending time: the preview shows the original image, which always displays.","تُحوَّل صور JPG وPNG والمسح الضوئي إلى PDF لحظة الإرسال: تعرض المعاينة الصورة الأصلية التي تظهر دائمًا."],["Aperçu d'un PDF : si la zone reste vide, « Ouvrir dans un onglet » l'affiche avec le lecteur du navigateur.","PDF preview: if the area stays blank, \"Open in a tab\" shows it with the browser's viewer.","معاينة PDF: إذا بقيت المنطقة فارغة فإن «فتح في علامة تبويب» يعرضه بقارئ المتصفح."],["Actualiser les données (vider le cache)","Refresh data (clear the cache)","تحديث البيانات (مسح الذاكرة المؤقتة)"],["Cache vidé : les données sont relues depuis le classeur.","Cache cleared: data is re-read from the workbook.","تم مسح الذاكرة المؤقتة: تُقرأ البيانات من جديد من المصنّف."],["Si une liste vous semble périmée ou incohérente, « Actualiser les données » force la relecture du classeur. Rechargez aussi la page (Ctrl+F5) pour récupérer la dernière version de l’application.","If a list looks outdated or inconsistent, \"Refresh data\" forces the workbook to be re-read. Also reload the page (Ctrl+F5) to get the latest version of the app.","إذا بدت قائمة قديمة أو غير متسقة فإن «تحديث البيانات» يفرض إعادة قراءة المصنّف. أعد أيضًا تحميل الصفحة (Ctrl+F5) للحصول على آخر إصدار من التطبيق."],["Actualiser la liste","Refresh the list","تحديث القائمة"],["Relire la liste depuis le serveur","Re-read the list from the server","إعادة قراءة القائمة من الخادم"],["La liste a été actualisée : ce document n’était plus en attente.","The list has been refreshed: this document was no longer pending.","تم تحديث القائمة: لم يعد هذا المستند قيد الانتظار."],["↻ Actualiser","↻ Refresh","↻ تحديث"],["Relire les données depuis le serveur","Re-read the data from the server","إعادة قراءة البيانات من الخادم"],["Données actualisées.","Data refreshed.","تم تحديث البيانات."],[" Agent deviné d'après un nom proche : à vérifier."," Agent guessed from a similar name: please check."," عون مُخمَّن من اسم مشابه: يرجى التحقق."],["Actualiser les données et agent deviné","Refresh data and guessed agent","تحديث البيانات والعون المُخمَّن"],["Un lien « ↻ Actualiser » en bas de page relit les données du serveur ; dans Setup → Maintenance, « Actualiser les données » vide le cache du classeur.","A \"↻ Refresh\" link at the bottom of the page re-reads the server data; in Setup → Maintenance, \"Refresh data\" clears the workbook cache.","يعيد رابط «↻ تحديث» أسفل الصفحة قراءة بيانات الخادم؛ وفي الإعدادات ← الصيانة يمسح «تحديث البيانات» الذاكرة المؤقتة للمصنّف."],["Correction d'un cas rare où une ancienne liste pouvait réapparaître quelques minutes après une modification.","Fixed a rare case where an old list could reappear a few minutes after a change.","تصحيح حالة نادرة كانت فيها قائمة قديمة تعود للظهور بعد دقائق من التعديل."],["Dépôt de documents : « Actualiser la liste », et la liste se met à jour toute seule si un document n'est plus en attente.","Document upload: \"Refresh the list\", and the list updates by itself if a document is no longer pending.","إيداع المستندات: «تحديث القائمة» وتتحدّث القائمة تلقائيًا إذا لم يعد مستند قيد الانتظار."],["Une faute de frappe dans le nom d'un fichier (BELMAHY au lieu de BELMAHI) ne bloque plus : l'agent est proposé, à vérifier.","A typo in a file name (BELMAHY instead of BELMAHI) no longer blocks: the agent is suggested, to be checked.","لم يعد الخطأ المطبعي في اسم الملف (BELMAHY بدل BELMAHI) يعطّل: يُقترح العون للتحقق."],["Heure invalide (HH:MM, par exemple 06:30)","Invalid time (HH:MM, e.g. 06:30)","وقت غير صالح (HH:MM، مثال 06:30)"],["Automatique chaque jour à","Automatic every day at","تلقائي كل يوم في الساعة"],["Heure du pointage automatique","Automatic recording time","وقت التسجيل التلقائي"],["Chaque jour à l’heure choisie, recopie le pointage de la veille pour chaque agent. Un jour déjà pointé n’est jamais remplacé : une correction à la main l’emporte.","Every day at the chosen time, copies the previous day's record for each agent. A day already recorded is never replaced: a manual correction wins.","في الساعة المختارة كل يوم، ينسخ تسجيل اليوم السابق لكل عون. لا يُستبدل أي يوم مسجَّل: التصحيح اليدوي هو الأرجح."],["✓ Actif : chaque jour vers ","✓ Active: every day around ","✓ مفعّل: كل يوم نحو الساعة "],[" · dernière fois : "," · last run: "," · آخر مرة: "],["Glissez vos documents ici","Drop your documents here","أفلت مستنداتك هنا"],["plusieurs à la fois : fiches de paie, titres de congé, contrats, attestations… (10 Mo maximum chacun)","several at once: payslips, leave tickets, contracts, certificates… (10 MB maximum each)","عدة ملفات دفعة واحدة: كشوف الراتب، سندات العطلة، العقود، الشهادات… (10 ميغابايت كحد أقصى لكل ملف)"],["ou choisir des fichiers","or choose files","أو اختر ملفات"],["Supprimer cette demande définitivement ?","Delete this request permanently?","حذف هذا الطلب نهائيًا؟"],["Annuler la décision ? La demande repasse « en attente » : vous pourrez la modifier, la transmettre à la direction ou la supprimer.","Cancel the decision? The request goes back to \"pending\": you can edit it, send it to management or delete it.","إلغاء القرار؟ يعود الطلب إلى «قيد الانتظار»: يمكنك تعديله أو إرساله إلى الإدارة أو حذفه."],["Annuler la décision","Cancel the decision","إلغاء القرار"],["Demande supprimée.","Request deleted.","تم حذف الطلب."],["Décision annulée : la demande est de nouveau en attente.","Decision cancelled: the request is pending again.","أُلغي القرار: الطلب قيد الانتظار من جديد."],["Décision","Decision","القرار"],["Réponse à l’agent","Reply to the agent","الرد على العون"],["Cette demande a été transmise à la direction : elle ne peut plus être annulée","This request has been sent to management: it can no longer be cancelled","أُرسل هذا الطلب إلى الإدارة: لا يمكن إلغاؤه بعد الآن" var HELP = [{"id":"debut","roles":["agent","chef","admin","client"],"t":["Pour commencer","Getting started","البداية"],"items":[{"t":["Sijil, de A à Z","Sijil, from A to Z","Sijil من الألف إلى الياء"],"x":["Sijil gère la mise à disposition de personnel et la prestation de services de bout en bout : 1) le bordereau des prix du contrat est déposé et lu automatiquement ; 2) le contrat fixe les fonctions, les effectifs et les prix ; 3) les agents et les véhicules sont affectés ; 4) le personnel est pointé jour après jour, avec ses prévisions, ses congés et ses documents ; 5) l'attachement du mois est édité à partir des jours réellement pointés, puis validé ; 6) la facture en découle. Le client suit tout et laisse ses remarques.","Sijil manages the provision of staff and service delivery from start to finish: 1) the contract's price schedule is uploaded and read automatically; 2) the contract sets the functions, staffing and prices; 3) agents and vehicles are assigned; 4) staff are recorded day after day, with forecasts, leave and documents; 5) the month's statement is produced from the days actually recorded, then validated; 6) the invoice follows. The client follows everything and leaves remarks.","يدير Sijil توفير الأعوان وتقديم الخدمات من البداية إلى النهاية: 1) يُرفع جدول أسعار العقد ويُقرأ تلقائيًا؛ 2) يحدّد العقد الوظائف والأعداد والأسعار؛ 3) يُعيَّن الأعوان والمركبات؛ 4) يُسجَّل حضور الأعوان يومًا بيوم مع التوقعات والإجازات والوثائق؛ 5) يُعدّ كشف إنجاز الشهر انطلاقًا من الأيام المسجَّلة فعليًا ثم يُعتمد؛ 6) وتنتج الفاتورة عنه. ويتابع الزبون كل شيء ويترك ملاحظاته."]},{"t":["Se connecter","Sign in","تسجيل الدخول"],"x":["Ouvrez Sijil, saisissez le code de votre entreprise (donné par votre administrateur), votre e-mail et votre mot de passe. Le mot de passe provisoire reçu par e-mail se change dès la première connexion avec « Mot de passe » en haut à droite.","Open Sijil, enter your company code (given by your administrator), your e-mail and your password. Change the temporary password you received by e-mail at your first sign-in, with \"Password\" at the top right.","افتح Sijil وأدخل رمز مؤسستك (يسلّمه لك المسؤول) وبريدك الإلكتروني وكلمة المرور. غيّر كلمة المرور المؤقتة التي وصلتك بالبريد عند أول دخول عبر «كلمة المرور» أعلى اليمين."],"img":{"f":"connexion","c":["L'écran de connexion (entreprise fictive).","The sign-in screen (fictional company).","شاشة تسجيل الدخول (شركة وهمية)."]}},{"t":["Installer sur le téléphone","Install on your phone","التثبيت على الهاتف"],"x":["Dans le navigateur, choisissez « Installer » ou « Ajouter à l'écran d'accueil » : Sijil s'ouvre ensuite comme une application, en plein écran.","In your browser, choose \"Install\" or \"Add to Home Screen\": Sijil then opens like an app, full screen.","من المتصفح اختر «تثبيت» أو «إضافة إلى الشاشة الرئيسية»: يُفتح Sijil بعدها كتطبيق بملء الشاشة."]},{"t":["Langue et mode sombre","Language and dark mode","اللغة والوضع الداكن"],"x":["En bas à droite de l'écran : le globe change la langue (français, arabe, anglais) et la bascule soleil / lune passe en mode sombre. Votre choix est mémorisé.","At the bottom right of the screen: the globe changes the language (French, Arabic, English) and the sun / moon switch turns dark mode on. Your choice is remembered.","أسفل يمين الشاشة: الكرة الأرضية لتغيير اللغة (الفرنسية، العربية، الإنجليزية) ومفتاح الشمس / القمر للوضع الداكن. يُحفظ اختيارك."],"img":{"f":"mobile-sombre","c":["Sijil sur téléphone, en mode sombre.","Sijil on a phone, in dark mode.","Sijil على الهاتف في الوضع الداكن."]}},{"t":["Les pastilles rouges","The red bubbles","الإشارات الحمراء"],"x":["Un chiffre rouge dans le menu signale du nouveau : documents reçus, demandes à traiter, remarques du client. Le chiffre disparaît quand vous ouvrez la page.","A red number in the menu shows something new: documents received, requests to handle, client remarks. The number disappears when you open the page.","رقم أحمر في القائمة يدل على جديد: وثائق مستلمة، طلبات للمعالجة، ملاحظات الزبون. يختفي الرقم عند فتح الصفحة."]},{"t":["Les couleurs du pointage","Attendance colours","ألوان الحضور"],"x":["Vert T = jour de travail. Orange R = repos ou congé. Rouge ABS = absence. Les teintes claires sont des jours prévus (ils ne comptent pas encore). Les jours fériés algériens sont repérés en violet (fêtes nationales) et en turquoise (fêtes religieuses).","Green T = work day. Orange R = rest or leave. Red ABS = absence. Light shades are planned days (not counted yet). Algerian public holidays are marked in purple (national) and teal (religious).","الأخضر T = يوم عمل. البرتقالي R = راحة أو إجازة. الأحمر ABS = غياب. الألوان الفاتحة أيام متوقّعة (لا تُحسب بعد). الأعياد الجزائرية بالبنفسجي (الوطنية) والفيروزي (الدينية)."]}]},{"id":"agent","roles":["agent"],"t":["Espace agent","Agent space","فضاء العون"],"items":[{"t":["Accueil : où en suis-je ?","Home: where do I stand?","الرئيسية: أين أنا؟"],"x":["La carte « Aujourd'hui » dit si vous êtes en travail ou en congé, combien de jours il vous reste, la date du prochain départ ou de la reprise, et le solde (T − CR) que vous aurez ce jour-là. Plus bas : vos totaux et votre cycle en cours.","The \"Today\" card says whether you are working or on leave, how many days are left, the date of the next departure or return, and the balance (T − CR) you will have that day. Below: your totals and your current cycle.","تبيّن بطاقة «اليوم» إن كنت في عمل أو إجازة، وكم يوم بقي، وتاريخ المغادرة أو العودة القادمة، والرصيد (T − CR) الذي سيكون لديك ذلك اليوم. وأسفلها مجاميعك ودورتك الحالية."],"img":{"f":"agent-accueil","c":["L'accueil de l'agent : jours restants, dates et solde.","The agent's home: days left, dates and balance.","الصفحة الرئيسية للعون: الأيام المتبقية والتواريخ والرصيد."]}},{"t":["Mon pointage","My attendance","حضوري"],"x":["Votre propre pointage, en lecture seule. Boutons Mois, 3 mois, 6 mois et 1 an : la grille s'étale à partir du mois choisi et montre aussi les jours prévus et les jours fériés.","Your own attendance, read-only. Buttons Month, 3 months, 6 months and 1 year: the grid spreads out from the chosen month and also shows planned days and public holidays.","حضورك أنت للاطلاع فقط. أزرار شهر و3 أشهر و6 أشهر وسنة: تمتد الشبكة ابتداءً من الشهر المختار وتُظهر أيضًا الأيام المتوقّعة والأعياد."],"img":{"f":"mon-pointage","c":["Le pointage du mois de l'agent.","The agent's month of attendance.","حضور العون خلال الشهر."]}},{"t":["Mes demandes","My requests","طلباتي"],"x":["Choisissez le type (titre de congé, attestation de travail, ATS, fiche d'émoluments, prolongation de congé ou de séjour), les dates si besoin, un message, puis « Envoyer ma demande ». Elle part chez votre responsable d’équipe, qui est prévenu par e-mail. Pour un titre de congé, la date de reprise est calculée pour vous.","Choose the type (leave certificate, work certificate, ATS, pay sheet, leave or stay extension), the dates if needed, a message, then \"Send my request\". It goes to your team manager, who is notified by e-mail. For a leave certificate, the return date is calculated for you.","اختر النوع (وثيقة إجازة، شهادة عمل، ATS، كشف أجر، تمديد إجازة أو إقامة) والتواريخ عند الحاجة ورسالة ثم «إرسال طلبي». يصل الطلب إلى رئيس فريقك ويُبلَّغ بالبريد. وبالنسبة لوثيقة الإجازة تُحسب لك تاريخ العودة."],"img":{"f":"agent-demandes","c":["Une nouvelle demande et le suivi de ses étapes.","A new request and its progress steps.","طلب جديد ومراحل متابعته."]}},{"t":["Mes documents","My documents","وثائقي"],"x":["Vos fiches d'émoluments, titres de congé et attestations déposés par votre responsable. Une pastille et un e-mail vous préviennent d'un nouveau document ; « Télécharger » l'enregistre sur votre appareil.","Your pay sheets, leave certificates and attestations uploaded by your manager. A bubble and an e-mail tell you about a new document; \"Download\" saves it on your device.","كشوف أجورك ووثائق إجازتك وشهاداتك التي رفعها مسؤولك. تنبّهك إشارة وبريد إلكتروني بوثيقة جديدة، و«تنزيل» يحفظها على جهازك."],"img":{"f":"agent-documents","c":["La liste des documents de l'agent.","The agent's documents.","وثائق العون."]}},{"t":["Laisser une remarque sur mon pointage","Leave a remark on my attendance","ترك ملاحظة على حضوري"],"x":["Dans « Mon pointage », cliquez sur un jour : écrivez votre remarque (par exemple « j'étais présent ce jour-là »). Votre responsable d'équipe est prévenu par e-mail, la consulte et peut vous répondre. Seuls vous et votre responsable la voient ; un repère rouge marque le jour.","In \"My attendance\", click a day and write your remark (for example \"I was present that day\"). Your team manager is notified by e-mail, reads it and can reply. Only you and your manager see it; a red marker flags the day.","في «حضوري» انقر على يوم واكتب ملاحظتك (مثلًا «كنت حاضرًا ذلك اليوم»). يُبلَّغ مسؤول فريقك بالبريد، ويقرؤها ويمكنه الرد. أنت ومسؤولك فقط من يراها؛ وتُعلَّم بعلامة حمراء."]}]},{"id":"pointer","roles":["chef","admin"],"t":["Pointer le personnel","Recording attendance","تسجيل حضور الأعوان"],"items":[{"t":["Pointer un agent","Record an agent","تسجيل عون"],"x":["Page « Pointer » : choisissez l'agent, la date (et « Jusqu'au » pour une période), le statut T, R ou ABS, puis « Valider le pointage ». « Effacer » retire un pointage. Vous pouvez aussi cliquer directement sur une case de la grille.","\"Record\" page: choose the agent, the date (and \"Until\" for a period), the status T, R or ABS, then \"Confirm\". \"Clear\" removes a record. You can also click a cell of the grid directly.","صفحة «تسجيل»: اختر العون والتاريخ (و«حتى» لفترة) والحالة T أو R أو ABS ثم «اعتماد». «مسح» يزيل تسجيلًا. ويمكنك أيضًا النقر مباشرة على خانة في الشبكة."],"img":{"f":"pointer","c":["Pointer un agent, compléter les jours, pointage automatique.","Record an agent, fill in days, automatic recording.","تسجيل حضور عون وإكمال الأيام والتسجيل التلقائي."]}},{"t":["Les prévisions (ombres)","Forecasts (shadows)","التوقعات (الظلال)"],"x":["Dès le premier pointage, Sijil prévoit les jours suivants selon la rotation (28/28, 14/14…). Un pointage réel n'est jamais remplacé : s'il diffère de la prévision, il devient le nouveau repère.","From the first record, Sijil forecasts the following days according to the rotation (28/28, 14/14…). A real record is never replaced: if it differs from the forecast, it becomes the new reference.","منذ أول تسجيل يتوقّع Sijil الأيام التالية حسب التناوب (28/28، 14/14…). لا يُستبدل التسجيل الفعلي أبدًا: إن اختلف عن التوقع يصبح المرجع الجديد."]},{"t":["Compléter les jours non pointés","Fill in unrecorded days","استكمال الأيام غير المسجَّلة"],"x":["Vous n'avez pas pointé pendant plusieurs jours ? Dans la barre au-dessus de la grille : cochez les agents (cases à gauche des noms), choisissez la date de fin (aujourd'hui par défaut), puis « Copier le dernier pointage ». Chaque agent garde son dernier statut jusqu'à cette date. Un résumé vous est montré avant d'écrire, et un jour déjà pointé n'est jamais remplacé. La case « rotation » suit la rotation prévue à la place.","Haven't recorded for several days? In the bar above the grid: tick the agents (boxes left of the names), choose the end date (today by default), then \"Copy the last record\". Each agent keeps their last status until that date. A summary is shown before writing, and a day already recorded is never replaced. The \"rotation\" box follows the planned rotation instead.","لم تسجّل منذ عدة أيام؟ في الشريط فوق الشبكة: حدّد الأعوان (الخانات يسار الأسماء) واختر تاريخ النهاية (اليوم افتراضيًا) ثم «نسخ آخر تسجيل». يحتفظ كل عون بآخر حالة له حتى هذا التاريخ. يُعرض ملخص قبل الكتابة ولا يُستبدل أي يوم مسجَّل. وخانة «التناوب» تتبع التناوب المتوقّع بدلًا من ذلك."]},{"t":["Pointage automatique","Automatic recording","التسجيل التلقائي"],"x":["Dans la barre « Compléter », cochez « Pointage automatique » et choisissez l'heure (6 h 30 par défaut). Chaque jour à cette heure, Sijil copie pour chaque agent le pointage de la veille, absences comprises. Un jour déjà pointé n'est jamais remplacé : si vous corrigez à la main, c'est vous qui avez raison. Le réglage est personnel : l'administrateur couvre tous les agents, le responsable d'équipe son équipe. Le pointage part dans la demi-heure qui suit l'heure choisie.","In the \"Complete\" bar, tick \"Automatic recording\" and choose the time (6:30 by default). Every day at that time, Sijil copies each agent's previous-day record, absences included. A day already recorded is never replaced: if you correct by hand, you are right. The setting is personal: the administrator covers all agents, a team leader covers their team. Recording runs within half an hour after the chosen time.","في شريط «استكمال» حدّد «التسجيل التلقائي» واختر الساعة (6:30 افتراضيًا). كل يوم في هذه الساعة ينسخ Sijil تسجيل اليوم السابق لكل عون، بما في ذلك الغيابات. لا يُستبدل أبدًا يوم مسجَّل: إذا صحّحتَ يدويًا فتصحيحك هو المعتمد. الإعداد شخصي: المسؤول يشمل كل الأعوان ومسؤول الفريق فريقه. يتم التسجيل خلال نصف ساعة بعد الساعة المختارة."]},{"t":["Vues 3 mois, 6 mois, 1 an et jours fériés","3-month, 6-month, 1-year views and holidays","عروض 3 أشهر و6 أشهر وسنة والأعياد"],"x":["Sur « Pointage global » (ou « Mon groupe »), les boutons Mois, 3 mois, 6 mois et 1 an étalent la grille à partir du mois choisi. Le jour d'aujourd'hui est marqué. Les fêtes nationales et religieuses algériennes sont marquées ; les dates religieuses sont estimées (un jour d'écart possible) et se corrigent dans Setup → Rotation.","On \"Global attendance\" (or \"My group\"), the buttons Month, 3 months, 6 months and 1 year spread the grid from the chosen month. Today is marked. Algerian national and religious holidays are marked; religious dates are estimated (a one-day difference is possible) and can be corrected in Setup → Rotation.","في «الحضور العام» (أو «فريقي») تمدّد أزرار شهر و3 أشهر و6 أشهر وسنة الشبكة ابتداءً من الشهر المختار. يُميَّز اليوم الحالي. وتُميَّز الأعياد الوطنية والدينية الجزائرية؛ والتواريخ الدينية تقديرية (قد يختلف يوم) ويمكن تصحيحها في الإعداد ← التناوب."],"img":{"f":"pointage-global","c":["Le pointage global du mois, avec les jours prévus.","The month's global attendance, with forecast days.","الحضور الشهري الإجمالي مع الأيام المتوقعة."]}},{"t":["Excel et PDF","Excel and PDF","Excel وPDF"],"x":["Les boutons Excel et PDF au-dessus de la grille produisent la fiche de pointage du mois.","The Excel and PDF buttons above the grid produce the month's attendance sheet.","زرّا Excel وPDF فوق الشبكة ينتجان ورقة حضور الشهر."]},{"t":["Exports : fiche, attachement, facture","Exports: sheet, statement, invoice","التصدير: الورقة، المحضر، الفاتورة"],"x":["L'onglet « Exports » permet au responsable d’équipe d'extraire en Excel ou PDF la fiche de pointage. L'attachement du mois et la facture déjà établie ne sont disponibles que si l'administrateur a coché « Autoriser l'extraction de l'attachement et de la facture » dans la fiche du chef. Il consulte seulement : la validation et la facturation restent à l'administrateur.","The \"Exports\" tab lets the team manager extract the attendance sheet as Excel or PDF. The month's statement and the issued invoice are only available if the administrator ticked \"Allow extracting the statement and the invoice\" in the leader's record. Read-only: validating and invoicing remain with the administrator.","تتيح علامة «التصدير» لمسؤول الفريق استخراج ورقة الحضور بصيغة Excel أو PDF. لا يتوفر محضر الشهر والفاتورة الصادرة إلا إذا فعّل المسؤول خيار «السماح باستخراج المحضر والفاتورة» في بطاقة الرئيس. للاطلاع فقط: الاعتماد والفوترة يبقيان للمسؤول."],"img":{"f":"exports","c":["Fiche de pointage, attachement et facture.","Attendance sheet, statement and invoice.","ورقة الحضور وكشف الإنجاز والفاتورة."]}}]},{"id":"agents","roles":["chef","admin"],"t":["Agents et véhicules","Agents and vehicles","الأعوان والمركبات"],"items":[{"t":["Créer un agent","Create an agent","إنشاء عون"],"x":["Page « Agents » : nom, e-mail (c'est son identifiant), rôle, contrat, fonction, affectation, rotation, responsable d’équipe. Laissez le mot de passe vide : il est généré. La case « Envoyer ses accès par e-mail » lui envoie le lien, son identifiant et son mot de passe provisoire.","\"Agents\" page: name, e-mail (this is the login), role, contract, function, assignment, rotation, team manager. Leave the password empty: it is generated. The \"Send access by e-mail\" box sends the link, the login and a temporary password.","صفحة «الأعوان»: الاسم والبريد (وهو المعرّف) والدور والعقد والوظيفة والتعيين والتناوب ورئيس الفريق. اترك كلمة المرور فارغة: تُنشأ تلقائيًا. خانة «إرسال بيانات الدخول بالبريد» ترسل الرابط والمعرّف وكلمة المرور المؤقتة."],"img":{"f":"agents","c":["Créer un agent et gérer la liste du personnel.","Create an agent and manage the staff list.","إنشاء عون وإدارة قائمة الأعوان."]}},{"t":["Renvoyer l'accès","Send access again","إعادة إرسال بيانات الدخول"],"x":["Le bouton « Envoyer l'accès » de la liste renvoie le lien et l'identifiant avec un nouveau mot de passe provisoire (l'ancien ne fonctionne plus).","The \"Send access\" button in the list sends the link and login again with a new temporary password (the old one stops working).","زر «إرسال بيانات الدخول» في القائمة يعيد إرسال الرابط والمعرّف مع كلمة مرور مؤقتة جديدة (لا تعمل القديمة)."]},{"t":["Responsable d’équipe","Team manager","رئيس الفريق"],"x":["Donnez le rôle « Responsable d’équipe » à un agent, puis choisissez-le dans le champ « Responsable d’équipe » des autres agents (ou en modification groupée). Il voit et pointe son équipe, et reçoit ses demandes.","Give the role \"Team manager\" to an agent, then choose them in the \"Team manager\" field of the other agents (or in bulk edit). They see and record their team's attendance and receive its requests.","امنح دور «رئيس الفريق» لأحد الأعوان ثم اخترْه في حقل «رئيس الفريق» لدى بقية الأعوان (أو بالتعديل الجماعي). يرى فريقه ويسجّل حضوره ويتلقى طلباته."]},{"t":["Modifier plusieurs agents d'un coup","Edit several agents at once","تعديل عدة أعوان دفعة واحدة"],"x":["Cochez plusieurs lignes : une barre apparaît en bas pour changer l'affectation, la rotation, le contrat, la fonction, le responsable ou le statut de tous.","Tick several lines: a bar appears at the bottom to change the assignment, rotation, contract, function, manager or status of all of them.","حدّد عدة أسطر: يظهر شريط في الأسفل لتغيير التعيين أو التناوب أو العقد أو الوظيفة أو المسؤول أو الحالة للجميع."]},{"t":["Véhicules mis à disposition","Vehicles provided","المركبات الموضوعة تحت التصرف"],"x":["Choisissez le type « Véhicule » : il est pointé comme un agent mais sans compte de connexion, et son nombre suit le contrat.","Choose the type \"Vehicle\": it is recorded like an agent but without a login, and its number follows the contract.","اختر النوع «مركبة»: تُسجَّل مثل العون لكن دون حساب دخول، ويتبع عددها العقد."]}]},{"id":"demandes","roles":["chef","admin"],"t":["Demandes des agents","Agents' requests","طلبات الأعوان"],"items":[{"t":["Recevoir et regrouper","Receive and group","الاستلام والتجميع"],"x":["Les demandes de votre groupe arrivent dans « Demandes », regroupées par thème, avec une pastille et un e-mail. Pour un titre de congé, vous voyez les dates et la date de reprise prévue.","Your group's requests arrive in \"Requests\", grouped by theme, with a bubble and an e-mail. For a leave certificate, you see the dates and the expected return date.","تصلك طلبات فريقك في «الطلبات» مجمَّعة حسب الموضوع مع إشارة وبريد إلكتروني. وبالنسبة لوثيقة الإجازة ترى التواريخ وتاريخ العودة المتوقّع."],"img":{"f":"demandes","c":["Demandes en cours, regroupées par thème.","Pending requests, grouped by theme.","الطلبات الجارية مجمّعة حسب الموضوع."]}},{"t":["Envoyer à la direction","Send to management","الإرسال إلى الإدارة"],"x":["Cochez les demandes à transmettre, ajoutez une note si besoin, puis « Envoyer à la direction » : une seule demande groupée part par e-mail (adresse de la direction à renseigner dans Setup → Prestataire).","Tick the requests to forward, add a note if needed, then \"Send to management\": a single grouped request is sent by e-mail (management's address is set in Setup → Provider).","حدّد الطلبات المراد إحالتها وأضف ملاحظة عند الحاجة ثم «إرسال إلى الإدارة»: يُرسل طلب جماعي واحد بالبريد (يُدخل عنوان الإدارة في الإعداد ← المؤدّي)."]},{"t":["Répondre à l'agent","Reply to the agent","الرد على العون"],"x":["Quand la direction répond, enregistrez la réponse : elle est appliquée à toutes les demandes de l'envoi et l'agent la voit.","When management replies, save the answer: it is applied to all the requests of the batch and the agent sees it.","عندما ترد الإدارة سجّل الرد: يُطبَّق على كل طلبات الإرسال ويراه العون."]},{"t":["Demander un document manquant","Request a missing document","طلب مستند ناقص"],"x":["Dans « Nouvelle demande », l'agent peut aussi demander une copie de son contrat, une attestation CNAS, une mise à jour CNAS ou une attestation d'émoluments, en plus du titre de congé, de l'attestation de travail, de l'ATS et de la fiche d'émoluments.","In \"New request\", an agent can also ask for a copy of their contract, a CNAS certificate, a CNAS update or an earnings certificate, in addition to the leave certificate, employment certificate, ATS and payslip.","في «طلب جديد» يمكن للعون أيضًا طلب نسخة من عقده أو شهادة CNAS أو تحديث CNAS أو شهادة الأجر، إضافةً إلى شهادة العطلة وشهادة العمل وATS وكشف الراتب."]}]},{"id":"documents","roles":["chef","admin"],"t":["Documents des agents","Agents' documents","وثائق الأعوان"],"items":[{"t":["Déposer des documents en vrac","Upload documents in bulk","إيداع مستندات دفعة واحدة"],"x":["Page « Documents » : choisissez plusieurs fichiers d'un coup (10 Mo maximum chacun) ; vous pouvez imposer un agent, ou laisser Sijil le reconnaître d'après le nom du fichier ou son contenu. Sijil reconnaît aussi le type et les dates, puis propose le nom : TC_NOM_Prenom_2026-02-14 (titre de congé, début du congé), NOM_Prenom_FDP_Mars2026 (fiche de paie), NOM_Prenom_2026-04-04_Contrat (début du contrat), NOM_Prenom_AttestationCNAS_n°_2026-05-07 (attestation CNAS, date du document), NOM_Prenom_MAJCNAS_Janvier2026_Mars2026 (mise à jour CNAS, mois couverts), NOM_Prenom_AttestationTravail_2026-05-04 (date d'établissement), NOM_Prenom_AttestationEmoluments_Janvier2026_Mars2026 (mois couverts). Le mois peut être abrégé dans le nom du fichier (FEVR 26, JANV 26, dec 25) ; il prime sur le contenu du document. Les photos et scans JPG ou PNG sont convertis en PDF au moment de l'envoi (l'aperçu montre l'image d'origine) ; les autres formats restent tels quels. Rien n'est envoyé aux agents : vous vérifiez la liste « À vérifier avant envoi » (agent, type, dates, nom modifiables), cochez, puis « Envoyer vers les espaces des agents » : chaque agent reçoit un seul e-mail récapitulatif.","Page \"Documents\": pick several files at once (10 MB maximum each); you can force one agent, or let Sijil recognise the agent from the file name or content. Sijil also recognises the type and dates, then proposes the name: TC_NAME_Firstname_2026-02-14 (leave certificate, leave start), NAME_Firstname_FDP_Mars2026 (payslip), NAME_Firstname_2026-04-04_Contrat (contract start), NAME_Firstname_AttestationCNAS_no_2026-05-07 (CNAS certificate, document date), NAME_Firstname_MAJCNAS_Janvier2026_Mars2026 (CNAS update, months covered), NAME_Firstname_AttestationTravail_2026-05-04 (issue date), NAME_Firstname_AttestationEmoluments_Janvier2026_Mars2026 (months covered). The month can be abbreviated in the file name (FEVR 26, JANV 26, dec 25) and takes precedence over the document content. JPG or PNG photos and scans are converted to PDF when sent (the preview shows the original image); other formats stay as they are. Nothing is sent to agents: check the \"To check before sending\" list (agent, type, dates and name are editable), tick, then \"Send to the agents' spaces\": each agent gets a single summary e-mail.","في صفحة «المستندات» اختر عدة ملفات دفعة واحدة (10 ميغابايت كحد أقصى لكل ملف)؛ يمكنك فرض عون معيّن أو ترك Sijil يتعرّف عليه من اسم الملف أو محتواه. يتعرّف أيضًا على النوع والتواريخ ثم يقترح الاسم: TC_NOM_Prenom_2026-02-14 وNOM_Prenom_FDP_Mars2026 وNOM_Prenom_2026-04-04_Contrat وNOM_Prenom_AttestationCNAS_n°_2026-05-07 وNOM_Prenom_MAJCNAS_Janvier2026_Mars2026 وNOM_Prenom_AttestationTravail_2026-05-04 وNOM_Prenom_AttestationEmoluments_Janvier2026_Mars2026. يمكن اختصار الشهر في اسم الملف (FEVR 26 وJANV 26 وdec 25) ويتقدّم على محتوى المستند. تُحوَّل صور JPG وPNG والمسح الضوئي إلى PDF عند الإرسال (تعرض المعاينة الصورة الأصلية)؛ وتبقى الصيغ الأخرى كما هي. لا يُرسل شيء إلى الأعوان: تراجع قائمة «للتحقق قبل الإرسال» (العون والنوع والتواريخ والاسم قابلة للتعديل) ثم تحدّد وتضغط «إرسال إلى مساحات الأعوان»: يتلقى كل عون بريدًا واحدًا ملخّصًا."],"img":{"f":"documents","c":["Glisser-déposer des documents : Sijil reconnaît l'agent et le type.","Drag and drop documents: Sijil recognises the agent and the type.","اسحب الوثائق وأفلتها: يتعرّف Sijil على العون والنوع."]}},{"t":["Corriger","Correct","تصحيح"],"x":["Si la reconnaissance se trompe, « Corriger » change le type ou la période : le fichier est renommé dans Drive.","If the recognition is wrong, \"Correct\" changes the type or the period: the file is renamed in Drive.","إن أخطأ التعرّف فإن «تصحيح» يغيّر النوع أو الفترة ويُعاد تسمية الملف في Drive."]},{"t":["Voir un document avant de l'envoyer","Preview a document before sending","معاينة مستند قبل إرساله"],"x":["Dans « À vérifier avant envoi », le bouton « Aperçu » ouvre le document (PDF ou image) dans une fenêtre pour vérifier que c'est le bon agent et le bon document ; « Ouvrir dans un onglet » l'agrandit, « Télécharger » l'enregistre. Le même bouton existe dans la liste des documents déjà rangés. Les formats Word et Excel n'ont pas d'aperçu : ouvrez-les ou téléchargez-les.","In \"To check before sending\", the \"Preview\" button opens the document (PDF or image) in a window so you can check it is the right agent and document; \"Open in a tab\" enlarges it, \"Download\" saves it. The same button exists in the list of filed documents. Word and Excel formats have no preview: open or download them.","في «للتحقق قبل الإرسال» يفتح زر «معاينة» المستند (PDF أو صورة) في نافذة للتأكد من العون والمستند؛ و«فتح في علامة تبويب» يكبّره و«تنزيل» يحفظه. الزر نفسه موجود في قائمة المستندات المحفوظة. صيغتا Word وExcel بلا معاينة: افتحهما أو نزّلهما."]},{"t":["Doublons","Duplicates","التكرار"],"x":["Sijil signale un même fichier déposé deux fois (« Doublon » en rouge : déjà classé chez l'agent ou déjà dans la liste) : il n'est pas coché d'office et son envoi demande une confirmation. Un document du même type et de la même période qu'un document déjà classé (par exemple une 2e fiche de paie de mars) reçoit un avertissement orange, sans blocage. La reconnaissance des doublons porte sur les documents déposés depuis cette version.","Sijil flags the same file uploaded twice (red \"Duplicate\": already filed for the agent or already in the list): it is not ticked by default and sending it requires confirmation. A document of the same type and period as an already filed one (e.g. a second March payslip) gets an orange warning, without blocking. Duplicate detection covers documents uploaded since this version.","ينبّه Sijil إلى الملف نفسه المودَع مرتين («مكرّر» بالأحمر: مصنّف لدى العون أو مدرج في القائمة): لا يُحدَّد تلقائيًا ويتطلب إرساله تأكيدًا. ويحصل مستند من النوع والفترة نفسيهما لمستند مصنّف (مثل كشف راتب ثانٍ لشهر مارس) على تحذير برتقالي دون منع. يشمل اكتشاف التكرار المستندات المودَعة منذ هذا الإصدار."]}]},{"id":"setup","roles":["admin"],"t":["Setup de l'entreprise","Company setup","إعداد المؤسسة"],"items":[{"t":["Contrat","Contract","العقد"],"x":["Déposez le bordereau des prix du contrat (PDF scanné, photo, Excel ou CSV) : les fonctions, nombres, délais et prix sont lus automatiquement, avec un contrôle du total. Complétez le contrat : début, durée en mois (la fin est calculée et visible de tous). Les e-mails du contact client (4 au maximum) se saisissent dans l'onglet Client.","Upload the contract's price schedule (scanned PDF, photo, Excel or CSV): functions, numbers, lead times and prices are read automatically, with a check of the total. Complete the contract: start, duration in months (the end is calculated and visible to all), client contact e-mail.","ارفع جدول أسعار العقد (PDF ممسوح أو صورة أو Excel أو CSV): تُقرأ الوظائف والأعداد والآجال والأسعار تلقائيًا مع مراجعة المجموع. أكمل العقد: البداية والمدة بالأشهر (تُحسب النهاية ويراها الجميع) وبريد جهة اتصال الزبون."],"img":{"f":"setup","c":["Setup : les réglages du prestataire et du contrat.","Setup: provider and contract settings.","الإعدادات: المتعامل والعقد."]}},{"t":["Prestataire et client","Provider and client","المؤدّي والزبون"],"x":["Les noms, adresses, en-têtes et signatures qui apparaissent sur les fiches, attachements et factures. Renseignez aussi l'e-mail de la direction pour les demandes groupées.","The names, addresses, headers and signatures that appear on sheets, statements and invoices. Also fill in management's e-mail for grouped requests.","الأسماء والعناوين والترويسات والتوقيعات التي تظهر في الأوراق وكشوف الإنجاز والفواتير. أدخل أيضًا بريد الإدارة للطلبات الجماعية."]},{"t":["Rotation et jours fériés","Rotation and holidays","التناوب والأعياد"],"x":["Rotation par défaut (28/28, 14/14, 21/21, 42/14, 7/7, 6/2, 3/3, 5/2 ou personnalisée), modifiable agent par agent. Le champ « Jours fériés » ajoute un jour (« 2027-03-10 Aïd el-Fitr ») ou en retire un (« - 2027-03-10 »).","Default rotation (28/28, 14/14, 21/21, 42/14, 7/7, 6/2, 3/3, 5/2 or custom), editable agent by agent. The \"Public holidays\" field adds a day (\"2027-03-10 Eid el-Fitr\") or removes one (\"- 2027-03-10\").","التناوب الافتراضي (28/28، 14/14، 21/21، 42/14، 7/7، 6/2، 3/3، 5/2 أو مخصّص) ويمكن تعديله لكل عون. يضيف حقل «الأعياد الرسمية» يومًا («2027-03-10 عيد الفطر») أو يحذف يومًا («- 2027-03-10»)."]},{"t":["Maintenance : export, import, sauvegarde","Maintenance: export, import, backup","الصيانة: التصدير والاستيراد والنسخ الاحتياطي"],"x":["Exporter un pointage en Excel avec le contrat, les prix, les agents et les attachements ; l'importer ailleurs ou le relire. Importer un pointage d'un fichier Excel (un mois par onglet, noms rapprochés des agents). Sauvegarder maintenant, restaurer une sauvegarde, ou vider les données (avec confirmation).","Export an attendance record to Excel with the contract, prices, agents and statements; import it elsewhere or read it back. Import attendance from an Excel file (one month per tab, names matched with agents). Back up now, restore a backup, or clear the data (with confirmation).","تصدير سجل حضور إلى Excel مع العقد والأسعار والأعوان وكشوف الإنجاز؛ واستيراده في مكان آخر أو إعادة قراءته. استيراد حضور من ملف Excel (شهر لكل تبويب مع مطابقة الأسماء). حفظ نسخة الآن واستعادة نسخة أو مسح البيانات (بتأكيد)."]},{"t":["Qui est connecté ?","Who is connected?","من متصل؟"],"x":["L'onglet « Connexions » (administrateur) montre qui est en ligne maintenant, la date de la dernière connexion de chaque utilisateur, le nombre de connexions et ceux qui ne se sont jamais connectés. Pour l'éditeur du produit, il rassemble toutes les entreprises clientes : un tableau par entreprise (comptes, en ligne, déjà connectés), le journal des dernières connexions et la liste de tous les utilisateurs. La liste se rafraîchit toute seule.","The \"Connections\" tab (administrator) shows who is online now, each user's last connection date, the number of connections and who has never connected. For the product publisher it gathers all client companies: a table per company (accounts, online, already connected), the latest connections log and the list of all users. The list refreshes by itself.","تعرض علامة «الاتصالات» (للمسؤول) من هو متصل الآن، وتاريخ آخر اتصال لكل مستخدم، وعدد الاتصالات، ومن لم يتصل أبدًا. وبالنسبة لناشر المنتج تجمع كل الشركات العميلة: جدول لكل شركة (الحسابات، المتصلون، من اتصل سابقًا)، وسجل آخر الاتصالات، وقائمة كل المستخدمين. تتحدّث القائمة تلقائيًا."]},{"t":["Éditeur : changer d'entreprise","Publisher: switch company","الناشر: تغيير الشركة"],"x":["Le compte éditeur a, dans l'en-tête, un sélecteur d'entreprise. Choisir un client ouvre son espace avec tous les droits de son administrateur : tous les onglets, les pointages (consultation et modification), les mots de passe des utilisateurs, les réglages. Un bandeau rappelle que vous êtes en mode support ; « Retour à l'administration » ou « Mon espace (éditeur) » ramène à votre console. Chaque accès est noté dans le journal des connexions. Un client suspendu doit d'abord être réactivé. Une deuxième liste permet de choisir un utilisateur de cette entreprise (agent, responsable, client…) et de se connecter à sa place pour voir ce qu'il voit et intervenir ; l'accès est noté dans le journal. La carte « Version » de l'onglet Clients indique si le site et le serveur sont à jour.","The publisher account has a company selector in the header. Choosing a client opens its space with all its administrator's rights: every tab, attendance (view and edit), user passwords, settings. A banner reminds you that you are in support mode; \"Back to administration\" or \"My space (publisher)\" returns to your console. Every access is recorded in the connections log. A suspended client must be reactivated first. A second list lets you pick one of the company's users (agent, manager, client…) and sign in as them to see what they see and step in; the access is recorded in the log. The \"Version\" card in the Clients tab shows whether the site and the server are up to date.","لحساب الناشر منتقي شركة في الترويسة. اختيار عميل يفتح مساحته بكل صلاحيات مسؤولها: كل العلامات، والحضور (اطلاع وتعديل)، وكلمات مرور المستخدمين، والإعدادات. يذكّرك شريط بأنك في وضع الدعم؛ و«العودة إلى الإدارة» أو «مساحتي (الناشر)» يعيدك إلى لوحتك. كل دخول يُسجَّل في سجل الاتصالات. يجب أولًا إعادة تفعيل العميل الموقوف. تتيح قائمة ثانية اختيار أحد مستخدمي الشركة (عون، مسؤول، عميل…) والدخول مكانه لرؤية ما يراه والتدخل؛ ويُسجَّل الدخول في السجل. تبيّن بطاقة «الإصدار» في علامة العملاء هل الموقع والخادم محدّثان."]}]},{"id":"facturation","roles":["admin"],"t":["Attachement et facture","Statement and invoice","كشف الإنجاز والفاتورة"],"items":[{"t":["Préparer l'attachement","Prepare the statement","تحضير كشف الإنجاز"],"x":["Depuis la carte du contrat ou « Exports » : choisissez le mois ; la quantité de chaque fonction reprend les jours réellement pointés. Vous pouvez corriger une quantité à la main. Le brouillon du mois suivant est affiché à titre indicatif.","From the contract card or \"Exports\": choose the month; each function's quantity uses the days actually recorded. You can correct a quantity by hand. The next month's draft is shown for information.","من بطاقة العقد أو «التصدير»: اختر الشهر؛ تعتمد كمية كل وظيفة على الأيام المسجَّلة فعليًا. يمكنك تصحيح كمية يدويًا. ويُعرض مسودة الشهر التالي للاطلاع."]},{"t":["Valider, facturer, rouvrir","Validate, invoice, reopen","الاعتماد والفوترة وإعادة الفتح"],"x":["« Valider l'attachement » le fige (mêmes quantités, mêmes prix). Ensuite, indiquez le numéro et la date de facture pour établir la facture. Un attachement non facturé peut être rouvert ; un attachement facturé ne peut plus l'être.","\"Validate the statement\" locks it (same quantities, same prices). Then enter the invoice number and date to issue the invoice. An uninvoiced statement can be reopened; an invoiced one cannot.","«اعتماد الكشف» يثبّته (نفس الكميات ونفس الأسعار). ثم أدخل رقم الفاتورة وتاريخها لإصدارها. يمكن إعادة فتح كشف غير مفوتر، أما المفوتر فلا."]},{"t":["Historique et PDF","History and PDF","السجل وPDF"],"x":["La carte du contrat liste tous les attachements et factures validés avec leurs PDF et Excel, et un tableau par fonction (précédente, du mois, cumulée, reste à facturer, montant).","The contract card lists all validated statements and invoices with their PDF and Excel files, and a table per function (previous, this month, cumulative, left to invoice, amount).","تسرد بطاقة العقد جميع ge: Sijil re-reads the data. For the administrator, Setup → Maintenance → \"Refresh data\" also clears the workbook cache. Finally reload the page (Ctrl+F5) to be sure you have the latest version of the app.","انقر «↻ تحديث» أسفل الصفحة: يعيد Sijil قراءة البيانات. وللمسؤول، يمسح «تحديث البيانات» في الإعدادات ← الصيانة أيضًا الذاكرة المؤقتة للمصنّف. وأخيرًا أعد تحميل الصفحة (Ctrl+F5) للتأكد من آخر إصدار للتطبيق."]}]}];

function emailsBox(value, onInput, n) {
