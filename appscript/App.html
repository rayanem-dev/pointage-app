<script>
(function () {
'use strict';
var S = { code: (function () { try { return localStorage.getItem('pt-code') || ''; } catch (e) { return ''; } })(), rotations: ['28/28'], token: null, user: null, params: null, canSetup: false, info: null };
try { S.token = sessionStorage.getItem('tk'); S.back = JSON.parse(sessionStorage.getItem('bk') || 'null'); S.clientsList = JSON.parse(sessionStorage.getItem('cl') || 'null'); } catch (e) { /* stockage indisponible */ }
function setBack(b) { S.back = b; S.badges = null; S.announced = {}; try { if (b) sessionStorage.setItem('bk', JSON.stringify(b)); else sessionStorage.removeItem('bk'); } catch (e) { /* ignore */ } }

// ---------- utilitaires ----------
function h(tag, props) {
  var e = document.createElement(tag);
  var kids = Array.prototype.slice.call(arguments, 2);
  var value;
  Object.keys(props || {}).forEach(function (k) {
    var v = props[k];
    if (v == null || v === false) return;
    if (k === 'class') e.className = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else if (k === 'value') value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected') e[k] = !!v;
    else e.setAttribute(k, v === true ? '' : (k === 'placeholder' || k === 'title' || k === 'alt' || k === 'aria-label') ? tr(v) : v);
  });
  kids.flat(Infinity).forEach(function (c) { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(tr(String(c)))); });
  if (value !== undefined) e.value = value;
  return e;
}
['confirm', 'prompt', 'alert'].forEach(function (n) { var o = window[n]; if (o) window[n] = function (m, d) { return o.call(window, tr(m), d); }; });
var $app = function () { return document.getElementById('app'); };
var MOIS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
var WEEK = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];
window.langHook = function (l, mois, jours) { MOIS.splice.apply(MOIS, [0, 12].concat(mois)); WEEK.splice.apply(WEEK, [0, 7].concat(jours)); };
var pad = function (n) { return (n < 10 ? '0' : '') + n; };
var todayStr = function () { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
var thisMonth = function () { return todayStr().slice(0, 7); };
var addDays = function (s, n) { var d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
var shiftMonth = function (k, n) { var y = +k.slice(0, 4); var m = +k.slice(5, 7); var t = y * 12 + m - 1 + n; return Math.floor(t / 12) + '-' + pad((t % 12) + 1); };
var monthLabel = function (k) { return MOIS[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4); };
var frDate = function (s) { return s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : ''; };
var frDateTime = function (s) { return s ? new Date(s).toLocaleString(LOCALE_I18N[LANG], { dateStyle: 'short', timeStyle: 'short' }) : ''; };
var signed = function (n) { return n > 0 ? '+' + n : String(n); };
var plural = function (n, w) { return n + ' ' + tr(w) + (n > 1 && LANG !== 'ar' ? 's' : ''); };
var STATUS_LABEL = { T: 'En travail', R: 'En congé (repos)', ABS: 'Absent' };
var STATUT_LABEL = { en_attente: 'En attente', envoyee: 'Envoyée à la direction', acceptee: 'Acceptée', refusee: 'Refusée', traitee: 'Traitée' };

function call(name) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok) return resolve(r.data);
        if (r && r.code === 'SESSION') sessionEnd();
        if (r && r.code === 'SUSPENDU') { S.flash = r.error; sessionEnd(); }
        return reject(new Error(tr((r && r.error) || 'Erreur')));
      })
      .withFailureHandler(function (e) { reject(new Error(tr((e && e.message) || String(e)))); })
      .rpc(S.token, name, args);
  });
}
// Déconnexion volontaire : le jeton « Rester connecté » de cet appareil est aussi oublié.
function logoutNow() {
  var rm = ''; try { rm = localStorage.getItem('pt-rm') || ''; localStorage.removeItem('pt-rm'); } catch (e) { /* ignore */ }
  Promise.all([call('logout').catch(function () {}), rm ? call('forget', rm).catch(function () {}) : null]).then(sessionEnd);
}
function sessionEnd() { S.token = null; S.user = null; S.path = null; S.owner = false; setBack(null); try { sessionStorage.removeItem('tk'); sessionStorage.removeItem('cl'); } catch (e) { /* ignore */ } boot(); } // boot relit l'état (annuaire, code entreprise)
function saveFile(r) {
  var bin = atob(r.base64); var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
  var a = h('a', { href: URL.createObjectURL(new Blob([bytes], { type: r.mime })), download: r.nom });
  document.body.append(a); a.click(); a.remove();
}
// Aperçu d'un fichier (PDF ou image) dans une fenêtre ; boutons pour l'ouvrir dans un onglet ou le télécharger.
function previewFile(r) {
  var bin = atob(r.base64); var bytes = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
  var mime = r.mime || ''; var isPdf = /pdf/i.test(mime) || /\.pdf$/i.test(r.nom); var isImg = /^image\//i.test(mime);
  var url = URL.createObjectURL(new Blob([bytes], { type: isPdf ? 'application/pdf' : mime }));
  var close = function () { URL.revokeObjectURL(url); m.remove(); document.removeEventListener('keydown', esc); };
  var esc = function (e) { if (e.key === 'Escape') close(); };
  var body = h('div', { class: 'mbody' });
  if (isImg) body.append(h('img', { src: url, alt: r.nom }));
  else if (isPdf) body.append(h('iframe', { src: url, title: r.nom }));
  else body.append(h('p', { class: 'muted', style: 'padding:24px' }, 'Aperçu indisponible pour ce format : ouvrez ou téléchargez le fichier.'));
  var open = h('a', { href: url, target: '_blank', rel: 'noopener', class: 'btnlike' }, 'Ouvrir dans un onglet');
  var dl = h('button', { type: 'button', onclick: function () { saveFile(r); } }, 'Télécharger');
  var x = h('button', { type: 'button', class: 'primary', onclick: close }, 'Fermer');
  var m = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', onclick: function (e) { if (e.target === m) close(); } },
    h('div', { class: 'mbox' }, h('div', { class: 'mhead' }, h('b', null, r.nom), open, dl, x), body));
  document.addEventListener('keydown', esc); document.body.append(m);
}
function fileToBase64(file) {
  return new Promise(function (resolve, reject) {
    var fr = new FileReader();
    fr.onload = function () { resolve(String(fr.result).split(',')[1]); };
    fr.onerror = function () { reject(new Error('Lecture du fichier impossible')); };
    fr.readAsDataURL(file);
  });
}
function msgBox() { var m = h('p', { class: 'msg', hidden: true, role: 'status' }); m.show = function (text, ok) { m.hidden = false; m.className = 'msg ' + (ok === 'warn' ? 'warn' : ok ? 'ok' : 'err'); m.textContent = tr(text); }; m.hide = function () { m.hidden = true; }; return m; }
// Exécute une action async depuis un bouton : désactive, affiche le résultat.
function act(btn, box, fn, okText) {
  btn.disabled = true; box.hide();
  return fn().then(function (r) { if (okText) box.show(typeof okText === 'function' ? okText(r) : okText, true); return r; })
    .catch(function (e) { box.show(e.message, false); })
    .then(function (r) { btn.disabled = false; return r; });
}
// Quatre cases distinctes pour quatre adresses e-mail ; la valeur (lue ou écrite) reste « a@x, b@y, c@z ».
function emailsBox(value, onInput) {
  var list = String(value || '').split(/[\s,;]+/).filter(Boolean);
  var ins = [0, 1, 2, 3].map(function (i) { return h('input', { type: 'email', placeholder: 'Adresse e-mail ' + (i + 1), value: list[i] || '', autocomplete: 'off' }); });
  var box = h('div', { class: 'emails3', style: 'display:grid;gap:6px' }, ins);
  Object.defineProperty(box, 'value', {
    get: function () { return ins.map(function (x) { return x.value.trim(); }).filter(Boolean).join(', '); },
    set: function (v) { var l = String(v || '').split(/[\s,;]+/).filter(Boolean); ins.forEach(function (x, i) { x.value = l[i] || ''; }); }
  });
  ins.forEach(function (x) { x.addEventListener('input', function () { if (onInput) onInput(box.value); }); });
  return box;
}
function emailsField(label, box, cls) { return h('div', { class: 'field ' + (cls || '') }, h('label', null, label), box); }
function field(label, input, cls, hint) { return h('label', { class: cls || '' }, label, input, hint ? h('small', null, hint) : null); }

// Choix d'une rotation « jours de travail/jours de repos » : liste proposée + valeur personnalisée.
// withDefault : ajoute « par défaut » (valeur vide). onChange reçoit la valeur ('' = défaut).
function rotationPicker(value, withDefault, defLabel, onChange, keepOption) {
  var list = S.rotations.slice();
  var sel = h('select', null, keepOption ? h('option', { value: '__keep' }, '— ne pas modifier —') : null, withDefault ? h('option', { value: '' }, defLabel) : null,
    list.map(function (r) { return h('option', { value: r }, r.replace('/', ' j travail / ') + ' j repos'); }), h('option', { value: '__autre' }, 'Autre rotation…'));
  var txt = h('input', { placeholder: 'ex. 10/5', pattern: '\\d+/\\d+', style: 'margin-top:6px' });
  var inList = list.indexOf(value) >= 0;
  sel.value = value === '__keep' ? '__keep' : (!value ? (withDefault ? '' : list[0]) : inList ? value : '__autre');
  if (value && !inList && value !== '__keep') txt.value = value;
  txt.hidden = sel.value !== '__autre';
  function out() { return sel.value === '__autre' ? txt.value.trim() : sel.value; }
  sel.onchange = function () { txt.hidden = sel.value !== '__autre'; onChange(out()); };
  txt.oninput = function () { onChange(out()); };
  return { node: h('div', null, sel, txt), set: function (v) { var l = list.indexOf(v) >= 0; sel.value = l ? v : '__autre'; txt.hidden = l; if (!l) txt.value = v; } };
}

function opts(list, valueKey, labelFn) { return list.map(function (x) { return h('option', { value: valueKey ? x[valueKey] : x }, labelFn ? labelFn(x) : x); }); }
function chip(s, prevu) { return h('span', { class: 'chip st-' + s + (prevu ? ' prevu' : '') }, s); }
function loading() { return h('p', { class: 'muted' }, 'Chargement…'); }

// Page asynchrone : affiche « Chargement… » puis le contenu (ou l'erreur).
function asyncBlock(promiseFn) {
  var box = h('div', null, loading());
  promiseFn().then(function (node) { box.replaceChildren(node); }).catch(function (e) { box.replaceChildren(h('p', { class: 'msg err' }, e.message)); });
  return box;
}

function loginView() {
  if (S.loginMode === 'forgot') return forgotView();
  var email = h('input', { type: 'email', required: true, autocomplete: 'username' });
  var pw = h('input', { type: 'password', required: true, autocomplete: 'current-password' });
  var box = msgBox();
  var btn = h('button', { class: 'primary' }, 'Se connecter');
  var remember = h('input', { type: 'checkbox', checked: true });
  var info = S.info || {};
  // Plusieurs clients sur ce déploiement : le code entreprise (lien d'invitation, QR code ou saisie) désigne le bon classeur.
  var code = h('input', { value: S.code, required: true, autocomplete: 'organization', placeholder: 'ex. HORIZON', style: 'text-transform:uppercase' });
  var titre = h('h1', null, info.prestataire || 'Sijil');
  code.addEventListener('change', function () { call('appInfo', code.value).then(function (i) { titre.textContent = i.prestataire || 'Sijil'; }).catch(function () { titre.textContent = 'Sijil'; }); });
  var form = h('form', { class: 'card', onsubmit: function (ev) {
    ev.preventDefault();
    act(btn, box, function () { return call('login', email.value, pw.value, (info.multi || code.value.trim().toUpperCase() === 'ADMIN') ? code.value : '', remember.checked); }).then(function (r) {
      if (!r) return;
      S.flash = null;
      if (info.multi) { S.code = code.value.trim().toUpperCase(); if (S.code !== 'ADMIN') { try { localStorage.setItem('pt-code', S.code); } catch (e) { /* ignore */ } } } // le code réservé de l'éditeur n'est pas mémorisé
      S.token = r.token; try { sessionStorage.setItem('tk', r.token); } catch (e) { /* ignore */ }
      try { if (r.remember) localStorage.setItem('pt-rm', r.remember); else localStorage.removeItem('pt-rm'); } catch (e) { /* ignore */ }
      S.notice = null; boot();
    });
  } },
    h('img', { src: LOGO, alt: 'Sijil', width: 72, height: 72, style: 'display:block;margin:0 auto 6px' }), titre, h('p', { style: 'text-align:center;margin:-4px 0 4px;color:var(--accent);font-weight:600' }, 'Gestion du temps de travail'), h('p', { class: 'muted' }, 'Connectez-vous à votre espace'),

    info.multi ? field('Code entreprise', code) : null, field('Email', email), field('Mot de passe', pw),

  return h('div', { class: 'login' }, form, h('p', { class: 'copyright' }, info.copyright || '', ' · ', h('a', { href: '#/confidentialite', onclick: function (ev) { ev.preventDefault(); S.charte = true; render(); } }, 'Confidentialité'),

// Mot de passe oublié : (1) l'adresse e-mail → un code à 6 chiffres arrive par e-mail ; (2) le code et le nouveau mot de passe.
function forgotView() {
  var info = S.info || {}; var box = msgBox(); var step = S.forgotStep || 1;
  var email = h('input', { type: 'email', required: true, autocomplete: 'username', value: S.forgotEmail || '' });
  var code = h('input', { value: S.forgotCode || S.code || '', required: true, placeholder: 'ex. HORIZON', style: 'text-transform:uppercase' });
  var secret = h('input', { inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: 6, required: true, placeholder: '000000' });
  var pw1 = h('input', { type: 'password', required: true, autocomplete: 'new-password' }); var pw2 = h('input', { type: 'password', required: true, autocomplete: 'new-password' });
  var back = h('a', { href: '#', onclick: function (ev) { ev.preventDefault(); S.loginMode = null; render(); } }, 'Retour à la connexion');
  var btn = h('button', { class: 'primary' }, step === 1 ? 'Envoyer le code' : 'Changer le mot de passe');
  var useCode = function () { return (info.multi || code.value.trim().toUpperCase() === 'ADMIN') ? code.value : ''; };
  var form = h('form', { class: 'card', onsubmit: function (ev) {
    ev.preventDefault();
    if (step === 1) {

    }

    step === 1 ? [info.multi ? field('Code entreprise', code) : null, field('Email', email)] : [field('Code reçu par e-mail', secret), field('Nouveau mot de passe (6 caractères min.)', pw1), field('Confirmer le mot de passe', pw2)], box, btn, h('p', { style: 'text-align:center;margin-top:10px' }, back));

      [[xl, 'xlsx'], [pdf, 'pdf']].forEach(function (p) {
        p[0].onclick = function () {
          var o = { month: month, contrat: contrat, format: p[1] }; var ex = extra ? extra() : {}; Object.keys(ex).forEach(function (k) { o[k] = ex[k]; });
          if (doc === 'Facture' && !ro && !String(o.facture_numero || '').trim()) { box.show('Indiquez le n° de facture.', false); return; }
          act(p[0], box, function () { return call(ro && doc === 'Facture' ? 'factureCopie' : 'export' + doc, o).then(saveFile); }, 'Document généré').then(function () { if (doc === 'Facture') draw(); }); // la facture est enregistrée sur l'attachement : on rafraîchit le statut
        };
      });
      return h('p', null, xl, ' ', pdf);
    }
    function lignesTable(p, editable) {
      var head = ['Désignation', 'Nombre', 'Qté contrat', 'Précédente', 'Du mois', 'Cumulée', 'Prix unitaire', 'Montant'].concat(editable ? ['Pointés'] : []);
      return h('div', { class: 'gridwrap' }, h('table', { class: 'table' }, h('thead', null, h('tr', null, head.map(function (x) { return h('th', null, x); }))),
        h('tbody', null, p.lines.map(function (l) {
          var cellMois;
          if (editable) {
            var q = h('input', { class: 'qty', type: 'number', min: 0, value: l.mois }); var ok = h('button', { hidden: true }, 'OK');
            q.oninput = function () { ok.hidden = false; };
            ok.onclick = function () { act(ok, box, function () { return call('attachementQte', { contrat: contrat, mois: month, designation: l.designation, qte_mois: q.value }); }, 'Quantité enregistrée').then(draw); };
            cellMois = h('td', null, q, ok, l.auto ? null : h('small', null, 'modifié'));
          } else cellMois = h('td', null, l.mois);
          return h('tr', null, h('td', null, l.designation, l.nature === 'vehicule' ? h('span', { class: 'badge' }, 'VH') : null), h('td', null, l.positions), h('td', null, l.contrat), h('td', null, l.precedente), cellMois, h('td', null, l.cumulee), h('td', null, dzd(l.prix_unitaire)), h('td', null, dzd(l.montant)), editable ? h('td', null, l.pointes) : null);
        }))));
    }
    function draw() {
      var chk = h('input', { type: 'checkbox', checked: prevu, onchange: function () { prevu = chk.checked; } });
      var tousChk = h('input', { type: 'checkbox', onchange: function () { tousChk.checked = tousChk.checked; } });
      var info = h('p', { class: 'muted' });
      if (contrat) call('ficheApercu', { month: month, contrat: contrat }).then(function (a) {
        info.textContent = tr(a.dans + ' agent(s) du contrat dans la fiche' + (a.hors ? ', ' + a.hors + ' hors contrat' : '') + '.' + (a.avertissements.length ? ' ⚠ ' + a.avertissements.join(' ') : ''));
      }).catch(function () {});
      var prev = h('div', null, loading()); var fsec = h('section', { class: 'card' }, h('h2', null, '3. Facture'), loading());
      host.replaceChildren(
        h('section', { class: 'card' }, h('h2', null, '1. Fiche de pointage ', h('small', null, 'à valider avec le client')), h('label', { class: 'inline' }, chk, ' Inclure les jours prévus'), h('label', { class: 'inline' }, tousChk, ' Inclure tous les agents (ignorer le contrat)'), info, buttons('Fiche', function () { return { prevu: prevu, tous: tousChk.checked }; })),
        h('section', { class: 'card' }, h('h2', null, '2. Attachement'), prev), fsec);
      if (ro && S.user.acces_exports !== '1') { prev.replaceChildren(h('p', { class: 'muted' }, "L'attachement et la facture ne sont pas autorisés pour votre compte : demandez ce privilège à l'administrateur.")); fsec.replaceChildren(h('h2', null, '3. Facture')); return; }
      if (!contrat) { prev.replaceChildren(h('p', { class: 'muted' }, 'Choisissez un contrat.')); fsec.replaceChildren(h('h2', null, '3. Facture')); return; }
      call('attachementPreview', month, contrat).then(function (p) {
        var st = STATUT_ATT[p.statut] || ['', ''];
        var title = h('h3', null, 'Attachement N° ' + p.numero + ' — ' + monthLabel(month) + ' ', h('span', { class: 'badge ' + st[1] }, st[0]));
        var total = h('p', null, 'Total HT : ', h('b', null, dzd(p.totalHT) + ' DA'));
        if (ro) {
          prev.replaceChildren(title, total, h('p', { class: 'muted' }, p.verrouille ? 'Attachement validé par l\u2019administrateur : copie figée.' : 'Brouillon calculé sur les jours pointés : seul l\u2019administrateur valide l\u2019attachement.'), lignesTable(p, false), buttons('Attachement'));
          fsec.replaceChildren(h('h2', null, '3. Facture ', p.statut === 'facture' ? h('span', { class: 'badge envoyee' }, 'Facturé') : null),
            p.facture_numero ? h('div', null, h('p', { class: 'muted' }, 'Facture N° ' + p.facture_numero + ' : copie en consultation.'), buttons('Facture')) : h('p', { class: 'muted' }, 'La facture n\u2019est pas encore établie par l\u2019administrateur.'));
          return;
        }
        if (p.verrouille) {
          var reopen = h('button', { class: 'danger' }, 'Rouvrir l\'attachement');
          reopen.onclick = function () { if (window.confirm("Rouvrir l'attachement ? Il redeviendra un brouillon modifiable.")) act(reopen, box, function () { return call('attachementRouvrir', { month: month, contrat: contrat }); }, 'Attachement rouvert').then(draw); };
          prev.replaceChildren(title, h('p', { class: 'muted' }, 'Validé le ' + frDateTime(p.date_validation) + ' par ' + p.valide_par + '. Copie figée : une modification du contrat, des prix ou des agents ne la change plus.'), lignesTable(p, false), total,
            buttons('Attachement'), p.statut === 'valide' ? reopen : h('small', null, 'Facturé : ne peut plus être rouvert.'));
        } else {
          var validate = h('button', { class: 'primary big' }, "Valider l'attachement");
          validate.onclick = function () { if (window.confirm("Valider l'attachement N° " + p.numero + " ? Il sera figé et servira de base à la facture.")) act(validate, box, function () { return call('attachementValider', { month: month, contrat: contrat }); }, 'Attachement validé').then(draw); };
          prev.replaceChildren(title, h('p', { class: 'muted' }, 'Brouillon calculé : quantité du mois = jours T réellement pointés (ou nombre × jours du mois si la base contractuelle est choisie dans Setup → Contrat) ; modifiable. « Pointés » = jours T réellement pointés, à titre de contrôle. Les mois se valident dans l’ordre.'), lignesTable(p, true), total, buttons('Attachement'), validate);
        }
        if (!p.verrouille) { fsec.replaceChildren(h('h2', null, '3. Facture'), h('p', { class: 'msg warn' }, "Validez d'abord l'attachement : la facture est générée à partir de l'attachement validé.")); return; }
        var fnum = h('input', { value: fac.numero || p.facture_numero || '', placeholder: '235/PS/2026', oninput: function () { fac.numero = fnum.value; } });
        var fdate = h('input', { type: 'date', value: fac.date || p.facture_date || '', oninput: function () { fac.date = fdate.value; } });
        fsec.replaceChildren(h('h2', null, '3. Facture ', p.statut === 'facture' ? h('span', { class: 'badge envoyee' }, 'Facturé') : null),
          h('p', { class: 'muted' }, "Générée à partir de l'attachement N° " + p.numero + ' validé : mêmes quantités et mêmes prix. Total HT : ' + dzd(p.totalHT) + ' DA.'),
          h('div', { class: 'row' }, field('N° de facture', fnum), field('Date de la facture', fdate)),
          buttons('Facture', function () { return { facture_numero: fnum.value, date: fdate.value }; }));
      }).catch(function (e) { prev.replaceChildren(h('p', { class: 'msg err' }, e.message)); fsec.replaceChildren(h('h2', null, '3. Facture')); });
    }
    wrap.replaceChildren(top, host); draw();
  }).catch(function (e) { wrap.replaceChildren(h('p', { class: 'msg err' }, e.message)); });
  return wrap;
}

function PasswordPage() {
  var cur = h('input', { type: 'password', required: true }); var nxt = h('input', { type: 'password', minlength: 6, required: true }); var box = msgBox(); var btn = h('button', { class: 'primary' }, 'Enregistrer');
  var form = h('form', { class: 'card narrow', onsubmit: function (ev) { ev.preventDefault(); act(btn, box, function () { return call('passwordOwn', cur.value, nxt.value); }, 'Mot de passe modifié').then(function (r) { if (r) form.reset(); }); } },
    h('h2', null, 'Changer mon mot de passe'), field('Mot de passe actuel', cur), field('Nouveau mot de passe (6 caractères min.)', nxt), box, btn);
  return form;
}

boot();
})();
