<script>
(function () {

// ---------- utilitaires ----------

}
var $app = function () { return document.getElementById('app'); };
var MOIS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
var WEEK = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];

var addDays = function (s, n) { var d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

var monthLabel = function (k) { return MOIS[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4); };
var frDate = function (s) { return s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : ''; };

function call(name) {

  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok) return resolve(r.data);
        if (r && r.code === 'SESSION') sessionEnd();

      })
      .withFailureHandler(function (e) { reject(new Error((e && e.message) || String(e))); })

}
function sessionEnd() { S.token = null; S.user = null; try { sessionStorage.removeItem('tk'); } catch (e) { /* ignore */ } render(); }
function saveFile(r) {
  var bin = atob(r.base64); var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
  var a = h('a', { href: URL.createObjectURL(new Blob([bytes], { type: r.mime })), download: r.nom });
  document.body.append(a); a.click(); a.remove();
}
function fileToBase64(file) {

}
function msgBox() { var m = h('p', { class: 'msg', hidden: true, role: 'status' }); m.show = function (text, ok) { m.hidden = false; m.className = 'msg ' + (ok === 'warn' ? 'warn' : ok ? 'ok' : 'err'); m.textContent = text; }; m.hide = function () { m.hidden = true; }; return m; }

// Page asynchrone : affiche « Chargement… » puis le contenu (ou l'erreur).
function asyncBlock(promiseFn) {
  var box = h('div', null, loading());
  promiseFn().then(function (node) { box.replaceChildren(node); }).catch(function (e) { box.replaceChildren(h('p', { class: 'msg err' }, e.message)); });

// ---------- connexion ----------
function loginView() {
  var email = h('input', { type: 'email', required: true, autocomplete: 'username' });

    h('h1', null, info.prestataire || 'Pointage'), h('p', { class: 'muted' }, 'Connectez-vous à votre espace'),

// ---------- structure ----------

function render() {

function boot() {

// ---------- accueil de l'agent ----------
function HomePage() {

      todayCard,
      h('div', { class: 'stats' }, stat('T ce mois', o.mois.T, 'st-T'), stat('CR ce mois', o.mois.R, 'st-R'), stat('ABS ce mois', o.mois.ABS, 'st-ABS'), stat('Total T', o.cumul.T), stat('Total CR', o.cumul.R), stat('Solde (T − CR)', signed(o.cumul.reliquat), o.cumul.reliquat < 0 ? 'neg' : 'pos')),
      c && c.run ? h('section', { class: 'card' }, h('h3', null, 'Cycle en cours'),
        h('p', null, chip(c.status), ' jour ', h('b', null, c.run), ' sur ' + c.total + (c.remaining > 0 ? ' — encore ' + plural(c.remaining, 'jour') : ' — cycle terminé')),
        h('div', { class: 'bar' }, h('div', { class: 'st-' + c.status, style: 'width:' + pct + '%' })),
        h('p', { class: 'muted' }, 'Prochain changement : ', h('b', null, frDate(c.next)), ' → ', chip(c.nextStatus, true))) : null,
      h('section', { class: 'card' }, h('div', { class: 'toolbar' }, h('h3', null, o.label), monthNav(month, function (mk) { month = mk; load(); })), cal,
        h('p', { class: 'legend' }, chip('T'), ' travail ', chip('R'), ' congé / repos ', chip('ABS'), ' absence ', chip('T', true), chip('R', true), ' prévus')),
      h('div', { class: 'stats' },
        h('a', { class: 'card tile', href: '#/demandes' }, h('b', null, o.demandes.en_attente), ' demande(s) en cours', h('small', null, o.demandes.total + ' au total · faire une demande')),
        h('a', { class: 'card tile', href: '#/documents' }, h('b', null, o.documents), ' document(s)', h('small', null, "Fiches d'émoluments, attestations, ATS…")))
    ];

}
function monthNav(month, onChange) {
  var input = h('input', { type: 'month', value: month, onchange: function () { if (input.value) onChange(input.value); } });
  return h('div', { class: 'monthnav' }, h('button', { type: 'button', 'aria-label': 'Mois précédent', onclick: function () { onChange(shiftMonth(input.value || month, -1)); } }, '‹'), input,
    h('button', { type: 'button', 'aria-label': 'Mois suivant', onclick: function () { onChange(shiftMonth(input.value || month, 1)); } }, '›'));

// ---------- grille mensuelle ----------
function GridView(o) {

  var menu = null;

  document.addEventListener('click', closeMenu);
  var msg = msgBox();

    closeMenu();

  }
  function openMenu(ev, agent, day) {
    ev.stopPropagation(); closeMenu();

      var chk = h('input', { type: 'checkbox', checked: prevu, onchange: function () { prevu = chk.checked; load(); } });
      var head = ['', ''];
      var thead = h('tr', null, h('th', { class: 'sticky' }, 'Nom et prénom'),
        Array.from({ length: g.nd }, function (_, i) { var wd = new Date(Date.UTC(+month.slice(0, 4), +month.slice(5, 7) - 1, i + 1)).getUTCDay(); return h('th', { class: wd === 5 ? 'fri' : '' }, i + 1, h('small', null, WEEK[wd])); }),
        h('th', null, 'T'), h('th', null, 'CR'), h('th', null, 'ABS'), h('th', { title: 'Cumul T − CR depuis le début' }, 'Solde'));
      var body = g.rows.map(function (r) {
        return h('tr', null, h('td', { class: 'sticky name' }, h('b', null, r.nom), h('small', null, r.fonction)),
          r.days.map(function (d, i) {
            var s = d.statut || (prevu ? d.prevu : '');
            var td = h('td', { class: 'day ' + (s ? 'st-' + s : '') + (!d.statut && s ? ' prevu' : '') + (o.canEdit ? ' edit' : '') }, s);
            if (o.canEdit) td.addEventListener('click', function (ev) { openMenu(ev, r, i + 1); });
            return td;
          }),
          h('td', { class: 'num' }, r.mois.T), h('td', { class: 'num' }, r.mois.R), h('td', { class: 'num' }, r.mois.ABS), h('td', { class: 'num ' + (r.cumul.reliquat < 0 ? 'neg' : 'pos') }, signed(r.cumul.reliquat)));
      });
      box.replaceChildren(
        h('div', { class: 'toolbar' }, monthNav(month, function (mk) { month = mk; load(); }), h('label', { class: 'inline' }, chk, ' Afficher les jours prévus'), o.exportable ? h('span', { class: 'grow right' }, xl, ' ', pdf) : null),
        msg,
        h('div', { class: 'gridwrap' }, h('table', { class: 'grid' }, h('thead', null, thead), h('tbody', null, body.length ? body : h('tr', null, h('td', { class: 'muted', colspan: g.nd + 5 }, 'Aucun agent.'))))),
        h('p', { class: 'legend' }, chip('T'), ' travail ', chip('R'), ' congé / repos ', chip('ABS'), ' absence ', chip('T', true), chip('R', true), ' prévus' + (o.canEdit ? ' · cliquez sur une case pour la modifier' : '')));
    }).catch(function (e) { box.replaceChildren(h('p', { class: 'msg err' }, e.message)); });
  }

// ---------- pointage (formulaire du chef de groupe / admin) ----------

function GroupePage() { return GridView({ canEdit: true, exportable: true }).el; }

// ---------- demandes ----------
function DemandesPage() {

    var d1 = h('input', { type: 'date' }); var d2 = h('input', { type: 'date' });

    var box = msgBox(); var btn = h('button', { class: 'primary' }, 'Envoyer ma demande');
    var dest = S.user.chef_id ? 'à votre chef de groupe' : "à l'administration";
    return h('form', { class: 'card', onsubmit: function (ev) {
