it the agents / vehicles that can be entered. To start from a price schedule, use the upload above. The statement number and previous quantities start from a reference month.","وظائف العقد هي أساس كشف الإنجاز وتحدّ من الأعوان / المركبات التي يمكن إدخالها. للانطلاق من جدول أسعار استخدم الرفع أعلاه. رقم الكشف والكميات السابقة ينطلقان من شهر مرجعي."],["Un classeur Excel avec un onglet par mois de pointage et, si un contrat est choisi, tout ce qui en dépend : contrat, fonctions et prix, agents, quantités saisies, attachements validés et factures, paramètres. Les mots de passe ne sont jamais exportés. Le fichier se réimporte ci-dessous.","An Excel workbook with one tab per attendance month and, if a contract is chosen, everything that depends on it: contract, functions and prices, agents, entered quantities, validated statements and invoices, settings. Passwords are never exported. The file can be re-imported below.","مصنّف Excel بتبويب لكل شهر حضور، وإذا اخترت عقدًا فكل ما يرتبط به: العقد والوظائف والأسعار والأعوان والكميات المدخلة وكشوف الإنجاز المعتمدة والفواتير والإعدادات. لا تُصدَّر كلمات المرور أبدًا. يمكن إعادة استيراد الملف أدناه."],["Un onglet par mois (« Mois de : Mai 2025 » ou onglet 2025-05), noms en colonne A, jours 1 à 31. T, R (ou CR) et ABS (ou AB) sont reconnus. Un export de pointage de l'application est lu en entier : contrat, prix, agents, attachements.","One tab per month (\"Month of: May 2025\" or tab 2025-05), names in column A, days 1 to 31. T, R (or CR) and ABS (or AB) are recognised. An attendance export from the application is read in full: contract, prices, agents, statements.","تبويب لكل شهر («شهر: ماي 2025» أو تبويب 2025-05)، الأسماء في العمود A، الأيام من 1 إلى 31. يتم التعرّف على T وR (أو CR) وABS (أو AB). يُقرأ تصدير الحضور من التطبيق كاملًا: العقد والأسعار والأعوان وكشوف الإنجاز."],["Une sauvegarde est une copie complète du classeur (agents, pointages, contrats, paramètres) rangée dans le dossier « Sauvegardes » de Drive, à côté du classe et recorded","استكمال الأيام غير المسجَّلة"],["Pour chaque agent coché, les jours entre son dernier pointage et la date de fin reprennent son dernier statut (T, R ou ABS). Un jour déjà pointé n'est jamais remplacé ; corrigez ensuite à la main les agents dont le statut a changé.","For each ticked agent, the days between the last record and the end date repeat the last status (T, R or ABS). A day already recorded is never replaced; then correct by hand the agents whose status has changed.","لكل عون محدَّد، تأخذ الأيام بين آخر تسجيل وتاريخ النهاية آخر حالة (T أو R أو ABS). لا يُستبدل أي يوم مسجَّل مسبقًا؛ ثم صحّح يدويًا الأعوان الذين تغيّرت حالتهم."],["Jusqu'au (aujourd'hui par défaut)","Until (today by default)","حتى (اليوم افتراضيًا)"],["À partir du (facultatif : sinon le lendemain du dernier pointage de chaque agent)","From (optional: otherwise the day after each agent's last record)","ابتداءً من (اختياري: وإلا اليوم الموالي لآخر تسجيل لكل عون)"],[" Suivre la rotation prévue au lieu de répéter le dernier statut"," Follow the planned rotation instead of repeating the last status"," اتباع التناوب المتوقّع بدل تكرار آخر حالة"],[" Tous les agents"," All agents"," جميع الأعوان"],["Copier le dernier pointage","Copy the last record","نسخ آخر تسجيل"],["Période trop longue (93 jours maximum par agent) : ","Period too long (93 days maximum per agent): ","فترة طويلة جدًا (93 يومًا كحد أقصى لكل عون): "],["Un seul bouton pour rattraper les jours oubliés : du lendemain du dernier pointage jusqu'à aujourd'hui, chaque agent garde son dernier statut (T, R ou ABS).","One button to catch up on forgotten days: from the day after the last record until today, each agent keeps their last status (T, R or ABS).","زر واحد لتدارك الأيام المنسية: من اليوم الموالي لآخر تسجيل حتى اليوم، يحتفظ كل عون بآخر حالة له (T أو R أو ABS)."],["Vous choisissez les agents (ou tous) et la date de fin. Vous pouvez aussi suivre la rotation prévue.","You choose the agents (or all) and the end date. You can also follow the planned rotation.","تختار الأعوان (أو الكل) وتاريخ النهاية. ويمكنك أيضًا اتباع التناوب المتوقّع."],["Les jours déjà pointés ne sont jamais modifiés. Un résumé vous est montré avant de valider.","Days already recorded are never changed. A summary is shown before you confirm.","لا تتغير الأيام المسجَّلة مسبقًا أبدًا. يُعرض ملخص قبل التأكيد."],["Compte client, remarques et durée du contrat","Client account, remarks and contract duration","حساب الزبون والملاحظات ومدة العقد"],["Le contrat indique maintenant sa date de début, sa durée et sa date de fin. Tout le monde peut les voir.","The contract now shows its start date, duration and end date. Everyone can see them.","يعرض العقد الآن تاريخ بدايته ومدته وتاريخ نهايته. يمكن للجميع الاطلاع عليها."],["En ajoutant l'e-mail du contact client dans le contrat, son compte de consultation est créé et ses accès peuvent lui être envoyés.","By adding the client contact's e-mail in the contract, their view-only account is created and their access can be sent to them.","بإضافة البريد الإلكتروني لجهة اتصال الزبون في العقد، يُنشأ حسابه للاطلاع ويمكن إرسال بيانات الدخول إليه."],["Le client peut laisser une remarque sur n'importe quel jour du pointage. Le chef de groupe est prévenu, répond, et le client voit la réponse.","The client can leave a remark on any day of the attendance. The group leader is notified, replies, and the client sees the reply.","يمكن للزبون ترك ملاحظة على أي يوم من الحضور. يُبلَّغ رئيس الفريق ويرد، ويرى الزبون الرد."],["Vues 3 mois, 6 mois, 1 an et jours fériés","3-month, 6-month and 1-year views and public holidays","عروض 3 أشهر و6 أشهر وسنة والأعياد الرسمية"],["Le pointage global peut s'afficher sur 3 mois, 6 mois ou 1 an, avec les mêmes couleurs que le mois. Le jour d'aujourd'hui est repéré.","The global attendance can be shown over 3 months, 6 months or 1 year, with the same colours as the month. Today is highlighted.","يمكن عرض الحضور العام على 3 أشهر أو 6 أشهر أو سنة بنفس ألوان الشهر. ويتم تمييز اليوم الحالي."],["Les jours fériés algériens sont visibles dans toutes les vues : fêtes nationales et fêtes religieuses. Les dates religieuses sont estimées (un jour d'écart est possible) et se corrigent dans Setup → Rotation.","Algerian public holidays are visible in all views: national and religious holidays. Religious dates are estimated (a one-day difference is possible) and can be corrected in Setup → Rotation.","الأعياد الرسمية الجزائرية ظاهرة في جميع العروض: الوطنية والدينية. التواريخ الدينية تقديرية (قد يكون هناك فرق يوم واحد) ويمكن تصحيحها في الإعداد ← التناوب."],["Pages plus rapides","Faster pages","صفحات أسرع"],["L'application s'ouvre et change de page plus vite.","The application opens and changes page faster.","يُفتح التطبيق وتتغير الصفحات بسرعة أكبر."],["Solde au départ et pointage de l'agent","Balance at departure and agent attendance","الرصيد عند المغادرة وحضور العون"],["Sur l'accueil de l'agent : le solde (T − CR) que l'agent aura le jour de son départ en congé, ou de sa reprise.","On the agent's home page: the balance (T − CR) the agent will have on the day they leave on leave, or return.","في الصفحة الرئيسية للعون: الرصيد (T − CR) الذي سيكون لديه يوم مغادرته في إجازة أو عودته."],["Nouvel onglet « Mon pointage » : l'agent consulte son propre pointage sur 1 mois, 3 mois, 6 mois ou 1 an.","New tab \"My attendance\": the agent views their own attendance over 1 month, 3 months, 6 months or 1 year.","تبويب جديد «حضوري»: يطلع العون على حضوره على شهر أو 3 أشهر أو 6 أشهر أو سنة."],["Les demandes de congé affichent les dates demandées et la date de reprise prévue.","Leave requests show the requested dates and the expected return date.","تعرض طلبات الإجازة التواريخ المطلوبة وتاريخ العودة المتوقّع."],["Pastilles et notifications","Bubbles and notifications","الإشارات والتنبيهات"],["Une pastille sur « Mes documents » indique les nouveaux documents. Un message s'affiche quand un document arrive, et l'agent reçoit aussi un e-mail.","A bubble on \"My documents\" shows new documents. A message appears when a document arrives, and the agent also receives an e-mail.","تظهر إشارة على «وثائقي» للوثائق الجديدة. تظهر رسالة عند وصول وثيقة، ويتلقى العون أيضًا بريدًا إلكترونيًا."],["Le chef de groupe voit une pastille sur « Demandes » et reçoit un e-mail à chaque nouvelle demande.","The group leader sees a bubble on \"Requests\" and receives an e-mail for each new request.","يرى رئيس الفريق إشارة على «الطلبات» ويتلقى بريدًا إلكترونيًا مع كل طلب جديد."],["Trois langues et mode sombre","Three languages and dark mode","ثلاث لغات والوضع الداكن"],["L'application existe en français, en arabe et en anglais. Le choix se fait en bas à droite.","The application is available in French, Arabic and English. The choice is at the bottom right.","التطبيق متوفر بالفرنسية والعربية والإنجليزية. يتم الاختيار أسفل اليمين."],["Un mode sombre est disponible, avec une petite bascule soleil / lune en bas à droite.","A dark mode is available, with a small sun / moon switch at the bottom right.","يتوفر وضع داكن مع مفتاح صغير شمس / قمر أسفل اليمين."],["Accès des agents par e-mail","Agent access by e-mail","إرسال بيانات دخول الأعوان بالبريد الإلكتروني"],["À la création d'un agent, ses accès (lien, identifiant, mot de passe provisoire) peuvent lui être envoyés par e-mail.","When an agent is created, their access (link, login, temporary password) can be sent to them by e-mail.","عند إنشاء عون، يمكن إرسال بيانات دخوله (الرابط، المعرّف، كلمة المرور المؤقتة) إليه بالبريد الإلكتروني."],["Un bouton « Envoyer l'accès » dans la liste des agents permet de les renvoyer à tout moment.","A \"Send access\" button in the agent list lets you send it again at any time.","يتيح زر «إرسال بيانات الدخول» في قائمة الأعوان إعادة إرسالها في أي وقت."],["Sijil : nouveau nom et nouveau logo","Sijil: new name and new logo","Sijil: اسم جديد وشعار جديد"],["L'application s'appelle Sijil, avec un nouveau logo et de nouvelles couleurs.","The application is now called Sijil, with a new logo and new colours.","يسمى التطبيق الآن Sijil، بشعار جديد وألوان جديدة."],["Export du pointage en Excel","Attendance export to Excel","تصدير الحضور إلى Excel"],["Setup → Maintenance : exporter un pointage en Excel, avec le contrat, les prix, les agents et les attachements qui en dépendent.","Setup → Maintenance: export an attendance record to Excel, with the contract, prices, agents and statements that depend on it.","الإعداد ← الصيانة: تصدير سجل حضور إلى Excel مع العقد والأسعار والأعوان وكشوف الإنجاز المرتبطة به."],["Le même fichier peut être réimporté en entier.","The same file can be fully re-imported.","يمكن إعادة استيراد الملف نفسه بالكامل."],["Import d'un pointage Excel","Attendance import from Excel","استيراد الحضور من Excel"],["Setup → Maintenance : importer un pointage depuis un fichier Excel, un mois par onglet.","Setup → Maintenance: import an attendance record from an Excel file, one month per tab.","الإعداد ← الصيانة: استيراد سجل حضور من ملف Excel، شهر لكل تبويب."],["Les noms écrits différemment sont rapprochés des agents existants, et les agents inconnus peuvent être créés.","Names written differently are matched with existing agents, and unknown agents can be created.","تتم مطابقة الأسماء المكتوبة بشكل مختلف مع الأعوان الموجودين، ويمكن إنشاء الأعوان غير المعروفين."],["Dans la modification groupée des agents, vous pouvez aussi changer la fonction.","In the agents' bulk edit, you can also change the function.","في التعديل الجماعي للأعوان، يمكنك أيضًا تغيير الوظيفة."],["Compte client (consultation)","Client account (view only)","حساب الزبون (للاطلاع فقط)"],["Nouveau rôle « Client » : il suit le pointage, le contrat, les attachements et les factures validés, sans rien modifier.","New role \"Client\": they follow the validated attendance, contract, statements and invoices, without changing anything.","دور جديد «الزبون»: يتابع الحضور والعقد وكشوف الإنجاز والفواتير المعتمدة دون تعديل أي شيء."],["Historique des attachements et factures","History of statements and invoices","سجل كشوف الإنجاز والفواتير"],["La liste des attachements et des factures validés, avec leurs PDF à télécharger.","The list of validated statements and invoices, with their PDFs to download.","قائمة كشوف الإنجاز والفواتير المعتمدة مع ملفات PDF للتنزيل."],["Un tableau par fonction montre ce qui a déjà été facturé et ce qui reste à facturer.","A table per function shows what has already been invoiced and what remains to be invoiced.","يعرض جدول لكل وظيفة ما تمت فوترته وما بقي للفوترة."],["Rotations et modification groupée","Rotations and bulk edit","التناوب والتعديل الجماعي"],["Plusieurs types de rotation au choix (28/28, 14/14, 21/21…), et une rotation propre à chaque agent.","Several rotation types to choose from (28/28, 14/14, 21/21…), and a rotation specific to each agent.","عدة أنواع تناوب للاختيار (28/28، 14/14، 21/21…) وتناوب خاص بكل عون."],["Dans la liste des agents, cochez plusieurs lignes pour les modifier en une seule fois.","In the agent list, tick several lines to edit them all at once.","في قائمة الأعوان، حدّد عدة أسطر لتعديلها دفعة واحدة."],["La quantité de l'attachement reprend les jours de travail réellement pointés.","The statement quantity uses the work days actually recorded.","تعتمد كمية كشف الإنجاز على أيام العمل المسجَّلة فعليًا."],["Setup en onglets","Setup in tabs","الإعداد في تبويبات"],["Le Setup est rangé en onglets : Contrat, Prestataire, Client, Rotation et Maintenance.","Setup is organised in tabs: Contract, Provider, Client, Rotation and Maintenance.","الإعداد منظّم في تبويبات: العقد، المؤدّي، الزبون، التناوب والصيانة."],["Sauvegarde et restauration de vos données depuis l'onglet Maintenance.","Backup and restore of your data from the Maintenance tab.","نسخ احتياطي واستعادة بياناتك من تبويب الصيانة."],["Fiche de pointage, attachement et documents","Attendance sheet, statement and documents","ورقة الحضور وكشف الإنجاز والوثائق"],["La fiche de pointage et l'attachement s'exportent en Excel et en PDF.","The attendance sheet and the state function tr(s) {
  if (LANG === 'fr' || s == null) return s;
  s = String(s); if (!s) return s;

    if (core && M[core] !== undefined) out = s.replace(core, M[core]);
    else if (s.length < 8) out = s;
    else { out = s; TRK[LANG].forEach(function (k) { if (out.indexOf(k) >= 0) out = out.split(k).join(M[k]); }); }
  }
  C[s] = out; return out;
}
